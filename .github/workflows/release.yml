name: Release (aria2c + embedded Web UI, multi-platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows (win-x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux (musl static)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS (arm64)'
        type: boolean
        default: true
      release_tag:
        description: 'Publish as this Web UI tag (e.g. v1.0.0); empty = the triggering tag. Required to re-publish an existing release from a branch run.'
        type: string
        default: ''

permissions:
  contents: write

env:
  # Every published binary is built from exactly this aria2 commit, and the GPL
  # corresponding-source promise names it.  A personal fork used to be the
  # source (with the tag resolved dynamically at run time), which meant the
  # source of an already-downloaded binary could drift or vanish; upstream
  # aria2/aria2 at a pinned commit cannot.  patches/clone-aria2.sh enforces it.
  ARIA2_REPO: aria2/aria2
  ARIA2_TAG: release-1.37.0
  ARIA2_SHA: 02f2d0d8472b3c38c29b4dba8c75ebd5fdd2899a

jobs:
  # Work out the release version this run represents, and whether it may
  # publish anything.  Nothing here resolves aria2 any more: that is pinned in
  # env above and enforced by patches/clone-aria2.sh.
  meta:
    runs-on: ubuntu-latest
    outputs:
      aria2_tag: ${{ steps.v.outputs.aria2_tag }}
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        run: |
          echo "aria2_tag=${ARIA2_TAG}" >> "$GITHUB_OUTPUT"
          # A tag push names the release after that tag.  A workflow_dispatch run
          # would otherwise report the branch name as github.ref_name, mis-naming
          # every artifact and opening a bogus release — so to re-publish an
          # existing release, dispatch must say which tag it stands for.
          VERSION="${{ github.event.inputs.release_tag || github.ref_name }}"
          case "$VERSION" in
            v[0-9]*) echo "publish=yes"  >> "$GITHUB_OUTPUT" ;;
            *)       echo "publish=no"   >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release version: ${VERSION} (aria2 ${ARIA2_TAG})"

  # Build the Web UI once; every platform job embeds this dist.
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The unbundled static archive is Apache-2.0 plus the notices of every JS
      # package compiled into it.  Those can only be read from an installed
      # node_modules, so they are generated here and travel as their own
      # artifact rather than being baked into dist/ (which is embedded in the
      # binaries and must stay byte-for-byte the app).
      - name: Generate the Web UI third-party notices
        run: |
          mkdir -p legal-webui
          pnpm licenses list --json --prod > pnpm-licenses.json
          node scripts/gen-third-party-notices.mjs \
            --platform webui --pnpm-json pnpm-licenses.json \
            --out legal-webui/THIRD-PARTY-NOTICES.txt
          cp LICENSE legal-webui/LICENSE
          cp NOTICE  legal-webui/NOTICE
      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: legal-webui
          path: legal-webui

  build-windows:
    needs: [meta, webui]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: webui-dist, path: dist }
      - name: Clone pinned aria2 (verifies the commit and that the patch applies)
        run: bash patches/clone-aria2.sh aria2
      - name: Build image (mingw cross + static deps)
        run: docker build -f docker/Dockerfile.win -t aria2-webui-win .
      - name: Compile aria2c.exe (static, WinTLS)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/w \
            -e ARIA2_SRC=/w/aria2 -e WEBUI_DIST=/w/dist -e OUT=/w/out/win \
            -e PKG_MODE=win -e STRIP=x86_64-w64-mingw32-strip \
            -e CONF_EXTRA="--host=x86_64-w64-mingw32 --build=x86_64-pc-linux-gnu --prefix=/usr/local/x86_64-w64-mingw32 --without-included-gettext --disable-nls --with-libcares --without-gnutls --without-openssl --with-sqlite3 --without-libxml2 --with-libexpat --with-libz --with-libgmp --with-libssh2 --without-libgcrypt --without-libnettle ARIA2_STATIC=yes CPPFLAGS=-I/usr/local/x86_64-w64-mingw32/include LDFLAGS=-L/usr/local/x86_64-w64-mingw32/lib PKG_CONFIG_LIBDIR=/usr/local/x86_64-w64-mingw32/lib/pkgconfig" \
            aria2-webui-win bash /w/patches/build-aria2-webui.sh
      - name: Fix ownership
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: out/win

  build-linux:
    needs: [meta, webui]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: webui-dist, path: dist }
      - name: Clone pinned aria2 (verifies the commit and that the patch applies)
        run: bash patches/clone-aria2.sh aria2
      - name: Build image (alpine/musl static)
        run: docker build -f docker/Dockerfile.linux -t aria2-webui-linux .
      - name: Compile aria2c (static musl, OpenSSL)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/w \
            -e ARIA2_SRC=/w/aria2 -e WEBUI_DIST=/w/dist -e OUT=/w/out/linux \
            -e PKG_MODE=unix \
            -e CONF_EXTRA="--enable-static --disable-shared --disable-nls --with-openssl --without-gnutls --with-libexpat --without-libxml2 --with-libcares --with-libssh2 --with-sqlite3 --with-zlib --with-libgmp --without-libgcrypt --without-libnettle LDFLAGS=-static CFLAGS=-static CXXFLAGS=-static" \
            aria2-webui-linux bash /w/patches/build-aria2-webui.sh
      - name: Fix ownership
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: out/linux

  build-macos:
    needs: [meta, webui]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    # Single Apple Silicon runner.  macos-13 (Intel) is near-retired / heavily
    # queued (a prior run waited ~3h then got cancelled), and Homebrew arm64
    # bottles carry no x86_64 slice, so a native universal build isn't practical
    # here.  Ship arm64; revisit Intel only if there's real demand.
    runs-on: macos-14
    env:
      # `brew update` was the ~3h sink and a known CI flake; skip it plus the
      # cleanup/env-hint noise.  git + node already ship on the runner.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: webui-dist, path: dist }
      - name: Install deps
        run: brew install autoconf automake libtool pkg-config gettext openssl@3 expat sqlite libssh2 c-ares gmp zlib
      - name: Clone pinned aria2 (verifies the commit and that the patch applies)
        run: bash patches/clone-aria2.sh aria2
      - name: Compile aria2c (static deps, OpenSSL)
        run: |
          # PKG_CONFIG_PATH must be exported in-shell: a step's `env:` map does
          # NOT go through the shell, so `$(brew --prefix)` there stays literal
          # (a latent bug in the previous version).  Set all three here.
          BREW="$(brew --prefix)"
          # gettext (keg-only) m4 discovery is handled centrally in
          # patches/build-aria2-webui.sh via ACLOCAL_PATH.
          export PKG_CONFIG_PATH="$BREW/lib/pkgconfig:$BREW/opt/openssl@3/lib/pkgconfig"
          export CPPFLAGS="-I$BREW/include -I$BREW/opt/openssl@3/include"
          export LDFLAGS="-L$BREW/lib -L$BREW/opt/openssl@3/lib"
          ARIA2_SRC="$PWD/aria2" WEBUI_DIST="$PWD/dist" OUT="$PWD/out/macos-arm64" \
          PKG_MODE=unix \
          CONF_EXTRA="--enable-static --disable-shared --disable-nls --with-openssl --without-gnutls --with-libexpat --without-libxml2 --with-libcares --with-libssh2 --with-sqlite3 --with-zlib --with-libgmp --without-libgcrypt --without-libnettle" \
          bash patches/build-aria2-webui.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: out/macos-arm64

  release:
    # Publish only when this run represents a version tag — either a real tag
    # push, or a dispatch that named one through release_tag.  The second form is
    # how an already-published release gets corrected (a missing license bundle,
    # say) without rewriting the tag or pretending a new version shipped.
    if: needs.meta.outputs.publish == 'yes'
    needs: [meta, build-windows, build-linux, build-macos, source-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: Attach license bundle and zip each artifact
        run: |
          VERSION='${{ needs.meta.outputs.version }}'
          ARIA2_TAG='${{ needs.meta.outputs.aria2_tag }}'
          cd artifacts
          for d in */; do
            name="${d%/}"
            case "$name" in
              # Auxiliary artifacts, not platforms: their contents are copied
              # into the platform directories below, never zipped on their own.
              legal-webui|source-bundle) continue ;;
            esac
            if [ "$name" = webui-dist ]; then
              # The unbundled static build contains no aria2 at all, so it gets
              # the Apache-2.0 package only.  Putting the combined-work license
              # here would describe a binary that is not in the zip.
              out="$GITHUB_WORKSPACE/aria2-webui-${VERSION}-dist.zip"
              cp legal-webui/LICENSE "$d/LICENSE"
              cp legal-webui/NOTICE  "$d/NOTICE"
              cp legal-webui/THIRD-PARTY-NOTICES.txt "$d/THIRD-PARTY-NOTICES.txt"
              # Section A of those notices cites texts as LICENSES/<file>, so the
              # static zip has to carry the files it names — a recipient reading a
              # license should not first have to visit the repository.  The list is
              # the same machine-readable one the platform archives use.
              mkdir -p "$d/LICENSES"
              node "$GITHUB_WORKSPACE/scripts/gen-third-party-notices.mjs" \
                --platform webui --list-license-files |
                while read -r text; do
                  cp "$GITHUB_WORKSPACE/licenses/$text" "$d/LICENSES/"
                done
              cp "$GITHUB_WORKSPACE/licenses/manifest.json" "$d/LICENSES/"
            else
              out="$GITHUB_WORKSPACE/aria2-${ARIA2_TAG}-webui-${VERSION}-${name}.zip"
              case "$name" in
                win-x64)     platform=win ;;
                linux-x64)   platform=linux ;;
                macos-arm64) platform=macos ;;
                *) echo "unknown artifact directory $name" >&2; exit 1 ;;
              esac
              # A GPL binary has to travel with its license text, the notices of
              # everything statically linked into it, and the pointer to the
              # corresponding source — all readable without visiting the repo.
              cp "$GITHUB_WORKSPACE/patches/LICENSE-BUNDLE" "$d/LICENSE"
              cp "$GITHUB_WORKSPACE/patches/NOTICE-BUNDLE"  "$d/NOTICE"
              mkdir -p "$d/LICENSES"
              # Only the texts this variant actually needs — musl does not belong
              # in the Windows zip — plus the machine-readable inventory they were
              # derived from, so a recipient can re-derive them.
              node "$GITHUB_WORKSPACE/scripts/gen-third-party-notices.mjs" \
                --platform "$platform" --list-license-files |
                while read -r text; do
                  cp "$GITHUB_WORKSPACE/licenses/$text" "$d/LICENSES/"
                done
              cp "$GITHUB_WORKSPACE/licenses/manifest.json" "$d/LICENSES/"
              node "$GITHUB_WORKSPACE/scripts/gen-third-party-notices.mjs" \
                --platform "$platform" --out "$d/THIRD-PARTY-NOTICES.txt"
            fi
            ( cd "$name" && zip -qr "$out" . )
          done
          cp source-bundle/*.tar.gz "$GITHUB_WORKSPACE/"
          ls -la "$GITHUB_WORKSPACE"/*.zip "$GITHUB_WORKSPACE"/*.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          # Re-running for a tag that already exists — to fix what it shipped —
          # replaces its assets instead of failing on a name collision.
          overwrite_files: true
          files: |
            aria2-*.zip
            aria2-*-sources.tar.gz
          name: "Aria2 WebUI ${{ needs.meta.outputs.version }} (内嵌 aria2 ${{ needs.meta.outputs.aria2_tag }})"
          body: |
            每个平台一个把 Web UI 内嵌进 `aria2c` 的单文件二进制；`aria2-webui-<版本>-dist.zip` 是未打包进二进制的 Web UI 静态产物；`aria2-<aria2-tag>-webui-<版本>-sources.tar.gz` 是这批二进制的完整对应源码。

            A single-binary `aria2c` per platform with the Web UI embedded; `aria2-webui-<version>-dist.zip`, the unbundled Web UI static build; and `aria2-<aria2-tag>-webui-<version>-sources.tar.gz`, the complete corresponding source of those binaries.

            - 内嵌的 aria2 / Embedded aria2: `${{ needs.meta.outputs.aria2_tag }}` @ `${{ env.ARIA2_SHA }}`
            - Web UI 版本 / Web UI version: `${{ needs.meta.outputs.version }}`

            用法 / Usage: Windows 运行 `start.bat`；Linux/macOS 运行 `./start.sh`，然后打开 http://localhost:6800/

            ---

            许可 / License — 每个压缩包内都带 `LICENSE`、`NOTICE`、`THIRD-PARTY-NOTICES.txt` 与 `LICENSES/` 许可证全文，不必访问本仓库即可知道权利与义务 / every archive carries its own LICENSE, NOTICE, THIRD-PARTY-NOTICES.txt and the full license texts under LICENSES/:

            - Web UI 源码与静态产物 / Web UI sources and static build: **Apache-2.0**.
            - 修改后的 aria2 与各平台二进制 / modified aria2 and the platform binaries: **GPL-3.0-or-later** — exercising aria2's "GPLv2 or later" option, chosen because Apache-2.0 is GPLv2-incompatible but GPLv3-compatible, which is what lets the panel be embedded lawfully.
            - 静态链接的第三方库 / statically linked components: OpenSSL, c-ares, Expat, SQLite, zlib, libssh2, GNU MP (GMP), musl, MinGW-w64 runtime, winpthread, libstdc++/libgcc — 逐条版权声明与许可文本见包内 `THIRD-PARTY-NOTICES.txt` / per-component notices are inside each archive.
            - 对应源码 / Corresponding source: 见上方 `*-sources.tar.gz` 资产（已打补丁的完整 aria2 源码树、Web UI blob 生成脚本、构建脚本、容器镜像与本工作流），构建固定使用上面那个 aria2 commit；也可按仓库 `patches/README.md` 自行重现。 / the sources asset above, pinned to the aria2 commit listed here.

  # GPLv3 requires the complete corresponding source of a conveyed binary to be
  # obtainable.  "Follow the recipe in the repo" is arguable; publishing the
  # patched tree as an asset of the same release is not, and it also freezes the
  # source against any later movement of the pinned tag.
  source-bundle:
    if: needs.meta.outputs.publish == 'yes'
    needs: [meta, webui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: webui-dist, path: dist }
      - name: Clone pinned aria2 (verifies the commit and that the patch applies)
        run: bash patches/clone-aria2.sh "$RUNNER_TEMP/aria2"
      - name: Assemble the corresponding source
        # Staging lives in RUNNER_TEMP, deliberately outside the repository work
        # tree: `git apply` run inside a repository resolves patch paths against
        # that repository's top level, so a staged copy under the checkout would
        # have its patch applied to the Web UI sources instead of the aria2 tree,
        # and we would publish a corresponding-source archive that is not the
        # source of the shipped binaries.  The assertions below make that failure
        # mode loud instead of silent.
        run: |
          set -euo pipefail
          ARIA2_TAG='${{ needs.meta.outputs.aria2_tag }}'
          VERSION='${{ needs.meta.outputs.version }}'
          BASE="aria2-${ARIA2_TAG}-webui-${VERSION}"
          WORK="${RUNNER_TEMP:?RUNNER_TEMP is not set}/cs"
          STAGE="$WORK/$BASE"
          mkdir -p "$STAGE/build-recipe"
          git -C "$RUNNER_TEMP/aria2" archive HEAD | tar -x -C "$STAGE"
          git -C "$STAGE" apply -p1 "$GITHUB_WORKSPACE/patches/aria2-embed-webui.patch"
          # Prove the patch really landed in the tree we are about to publish.
          test -f "$STAGE/src/WebUiServer.cc"
          test -f "$STAGE/src/WebUiServer.h"
          grep -q 'Modified by' "$STAGE/src/HttpServerCommand.cc"
          grep -q 'Modified by' "$STAGE/src/Makefile.am"
          node patches/gen_webui_blob.mjs "$GITHUB_WORKSPACE/dist" "$STAGE/src/WebUiBlob.cc"
          test -s "$STAGE/src/WebUiBlob.cc"
          # The recipe that produced it: exactly this repository's tracked files,
          # so nothing (patches, dockerfiles, licenses, lockfile) can be quietly
          # left out the way a hand-written cp list would.
          git archive HEAD | tar -x -C "$STAGE/build-recipe"
          cat > "$STAGE/build-recipe/README.txt" <<EOF
          Corresponding source for the aria2c binaries published with this release.

            patched aria2 tree : the directory above, under GPL-3.0-or-later section 1
            aria2 source       : ${{ env.ARIA2_REPO }} tag ${ARIA2_TAG} commit ${{ env.ARIA2_SHA }}
            webui repository   : ${{ github.repository }} commit ${{ github.sha }}
            workflow run       : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Rebuild: pnpm install && pnpm build, then follow build-recipe/patches/README.md.
          EOF
          tar -czf "$GITHUB_WORKSPACE/$BASE-sources.tar.gz" -C "$WORK" "$BASE"
          ls -la "$GITHUB_WORKSPACE/$BASE-sources.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: source-bundle
          path: '*-sources.tar.gz'
          if-no-files-found: error
