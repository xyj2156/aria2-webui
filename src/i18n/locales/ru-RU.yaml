options:
  all-proxy-passwd:
    name: Пароль прокси-сервера
  all-proxy-user:
    name: Имя пользователя прокси-сервера
  all-proxy:
    description: 'Устанавливает адрес прокси-сервера для всех протоколов. Также можно переопределить эту опцию для конкретных протоколов, используя опции --http-proxy, --https-proxy и --ftp-proxy. Это настройка будет влиять на все загрузки. Формат адреса прокси-сервера: [http://][USER:PASSWORD@]HOST[:PORT].'
    name: Прокси-сервер
  allow-overwrite:
    description: Перезагружает файл с начала, если соответствующий контрольный файл не существует. См. опцию --auto-file-renaming.
    name: Разрешить перезапись
  allow-piece-length-change:
    description: Если установлено на "Нет", aria2 остановит загрузку, если длина части отличается от длины в контрольном файле. Если установлено на "Да", можно продолжить, но часть прогресса загрузки будет потеряна.
    name: Разрешить изменение длины части
  always-resume:
    description: Всегда возобновляет прерванную загрузку. Если установлено на "Да", aria2 всегда пытается возобновить прерванную загрузку, иначе останавливает загрузку. Если установлено на "Нет", для URI, которые не поддерживают возобновление загрузки, или если aria2 сталкивается с N URI, которые не поддерживают возобновление загрузки (N - значение, установленное опцией --max-resume-failure-tries), aria2 загрузит файл с начала. См. параметр --max-resume-failure-tries.
    name: Всегда возобновлять
  async-dns:
    name: Асинхронный DNS
  auto-file-renaming:
    description: Переименовывает файлы
    name: Автоматическое переименование файлов
  auto-save-interval:
    description: Автоматически сохраняет контрольный файл (*.aria2) каждые указанные секунды. Если установлено на 0, контрольный файл не будет автоматически сохранен во время загрузки. Независимо от установленного значения, aria2 сохранит контрольный файл после завершения задачи. Значение может быть установлено от 0 до 600.
    name: Интервал автоматического сохранения
  bt-detach-seed-only:
    description: Исключает только задачи посева при подсчете активных задач загрузки (см. опцию -j). Это означает, что если параметр установлен на -j3 и в настоящее время есть 3 активные задачи, одна из которых в режиме посева, она будет исключена (т.е. число станет 2) и следующая задача в очереди будет запущена. Однако важно отметить, что в методах RPC задачи посева по-прежнему считаются активными.
    name: Отделить только задачи посева
  bt-enable-hook-after-hash-check:
    description: Позволяет выполнять команду после завершения проверки хэша загрузок BT (см. опцию -V). По умолчанию, когда проверка хэша успешна, будет выполнена команда, установленная через --on-bt-download-complete. Чтобы отключить это поведение, установите значение "нет".
    name: Включить событие по окончанию проверки хэша
  bt-enable-lpd:
    name: Включить обнаружение локальных узлов (LPD)
  bt-exclude-tracker:
    description: Исключенные адреса трекеров BT, разделенные запятыми. Можно использовать * для совпадения всех адресов, тем самым исключая все адреса трекеров. При использовании * в командной строке оболочки необходимо использовать экранирование или кавычки.
    name: Исключить адреса трекеров BT
  bt-external-ip:
    description: Указывает внешний IP-адрес, используемый для загрузок BitTorrent и DHT. Может быть отправлен на серверы BitTorrent. Для DHT эта опция сообщит локальным узлам о загрузке определенного торрента. Это важно для использования DHT в частных сетях. Хотя называется "внешний", принимает различные типы IP-адресов.
    name: Внешний IP-адрес
  bt-force-encryption:
    description: Содержимое BT сообщений должно быть зашифровано с использованием arc4. Эта опция является быстрым способом установки --bt-require-crypto --bt-min-crypto-level=arc4. Не изменяет содержимое этих двух опций. Если установлено значение "да", отклоняет предыдущие BT рукопожатия и использует только замаскированные рукопожатия и зашифрованные сообщения.
    name: Принудительное шифрование
  bt-hash-check-seed:
    description: Если установлено значение "да", aria2 продолжит посев только после завершения проверки хэша и завершения файла, используя опцию --check-integrity. Если необходимо проверять только файлы, когда они повреждены или неполные, установите значение "нет". Эта опция действует только для загрузок BT.
    name: Проверка хэша перед посевом
  bt-load-saved-metadata:
    description: При использовании магнитной загрузки сначала пытается загрузить сохраненный файл с опцией --bt-save-metadata перед загрузкой метаданных из DHT. Если загрузка файла успешна, метаданные не будут загружены из DHT.
    name: Загрузка сохраненных метаданных
  bt-max-open-files:
    description: Устанавливает максимальное количество открытых файлов глобально для загрузок BT/Metalink.
    name: Максимальное количество открытых файлов
  bt-max-peers:
    description: Устанавливает максимальное количество подключенных пиров для каждой загрузки BT. 0 означает отсутствие ограничений.
    name: Максимальное количество пирингов
  bt-metadata-only:
    description: Скачивает только торрент-файлы. Файлы, описанные в торрент-файле, не будут загружены. Эта опция действует только для магнитных ссылок.
    name: Скачать только метаданные
  bt-min-crypto-level:
    description: Устанавливает минимальный уровень шифрования. Если пир предлагает несколько методов шифрования, aria2 выберет минимальный уровень, соответствующий указанному.
    name: Минимальный уровень шифрования
  bt-prioritize-piece:
    description: 'Пытается сначала загрузить части в начале или конце каждого файла. Эта опция полезна для предварительного просмотра файлов. Параметры могут включать два ключевых слова: head и tail. Если присутствуют оба ключевых слова, их следует разделить запятой. Каждое ключевое слово может включать параметр SIZE. Например, указав head=SIZE, первые SIZE данных каждого файла будут иметь более высокий приоритет. tail=SIZE означает последние SIZE данных каждого файла. SIZE может включать K или M (1K=1024, 1M=1024K).'
    name: Приоритет загрузки
  bt-remove-unselected-file:
    description: После завершения задачи BT удаляет невыбранные файлы. Для выбора файлов для загрузки используйте опцию --select-file. Если файлы не выбраны, все файлы будут считаться загружаемыми по умолчанию. Эта опция удаляет файлы напрямую с диска, поэтому используйте ее с осторожностью.
    name: Удалить невыбранные файлы
  bt-request-peer-speed-limit:
    description: Если общая скорость загрузки BT ниже значения, установленного этой опцией, aria2 временно увеличит количество соединений для повышения скорости загрузки. В некоторых обстоятельствах установка желаемой скорости загрузки может улучшить скорость загрузки. Можно добавить единицы K или M (1K=1024, 1M=1024K).
    name: Желаемая скорость загрузки от пиров
  bt-require-crypto:
    description: Если установлено значение "да", aria не примет ранние рукопожатия BitTorrent (\19протокол BitTorrent) и установит только замаскированное соединение. Таким образом, aria2 будет использовать только замаскированные рукопожатия.
    name: Обязательное шифрование
  bt-save-metadata:
    description: Сохраняет торрент-файл как файл ".torrent". Эта опция действует только для магнитных ссылок. Имя файла представляет собой шестнадцатеричный хэш, закодированный в шестнадцатеричном формате, за которым следует расширение ".torrent". Он сохраняется в той же директории, что и загруженные файлы. Если файл с таким именем уже существует, торрент-файл не будет сохранен.
    name: Сохранить торрент-файл
  bt-seed-unverified:
    description: Не проверяет хэш каждого куска ранее загруженных файлов.
    name: Не проверять уже загруженные файлы
  bt-stop-timeout:
    description: Когда скорость загрузки BT задачи остается на уровне 0 в течение времени, установленного этой опцией, загрузка останавливается. Если установлено значение 0, эта функция будет отключена.
    name: Автоматическое завершение без скорости
  bt-tracker-connect-timeout:
    description: Устанавливает тайм-аут подключения к трекеру BT в секундах. После установления соединения эта опция больше не действует, используйте опцию --bt-tracker-timeout.
    name: Тайм-аут подключения к трекеру BT
  bt-tracker-interval:
    description: Устанавливает интервал запросов к трекеру BT в секундах. Эта опция полностью переопределит минимальный интервал и интервал, возвращаемые трекером, aria2 будет использовать только значение этой опции. Если установлено значение 0, aria2 решит интервал на основе ответа трекера и прогресса загрузки.
    name: Интервал подключения к трекеру BT
  bt-tracker-timeout:
    name: Тайм-аут трекера BT
  bt-tracker:
    description: Адреса трекеров BT, разделенные запятыми. Эти адреса не подвержены влиянию опции --bt-exclude-tracker, так как добавляются только после того, как опция --bt-exclude-tracker исключила другие адреса.
    name: Адрес трекера BT
  check-certificate:
    name: Проверка сертификата
  check-integrity:
    description: Проверяет целостность файла путем проверки хэша каждого блока или всего файла. Эта опция действует только для BT, Metalink и HTTP(S)/FTP ссылок, которые настроили опцию --checksum.
    name: Проверка целостности
  checksum:
    description: 'Устанавливает контрольную сумму. Формат значения опции TIPO=DIGEST. TIPO - это поддерживаемый тип хэша, перечисленный в aria2c -v hash алгоритмах. DIGEST - это шестнадцатеричный дайджест. Например, установить sha-1 хэш будет так: sha-1=0192ba11326fe2298c8cb4de616f4d4140213838. Эта опция действует только для HTTP(S)/FTP загрузок.'
    name: Контрольная сумма
  conditional-get:
    description: Загружает файл только если он старше локального файла. Эта функция работает только для загрузок HTTP(S). Если размер файла уже указан в Metalink, функция не будет действовать. Также эта функция проигнорирует заголовок ответа Content-Disposition. Если существует контрольный файл, эта опция будет проигнорирована. Эта функция использует заголовок запроса If-Modified-Since для получения самого нового файла. При извлечении времени модификации локального файла, эта функция будет использовать имя файла, предоставленное пользователем (см. опцию --out), или имя файла в URI, если опция --out не указана. Для перезаписи существующего файла необходимо использовать параметр --allow-overwrite.
    name: Условная загрузка
  conf-path:
    name: Путь к файлу конфигурации
  connect-timeout:
    description: Устанавливает тайм-аут (в секундах) для установки соединения с HTTP/FTP/прокси сервером. После установления соединения, эта опция больше не будет действовать, используйте опцию --timeout.
    name: Тайм-аут подключения
  console-log-level:
    name: Уровень логов консоли
  content-disposition-default-utf8:
    description: Использует набор символов UTF-8 вместо ISO-8859-1 для обработки строки в заголовке "Content-Disposition", например, параметра имени файла, но не имени файла расширенной версии.
    name: Использовать UTF-8 для обработки Content-Disposition
  continue:
    description: Возобновляет загрузку частично загруженных файлов. Включение этой опции позволяет возобновить загрузку файлов, скачанных последовательно браузером или другими программами. Эта опция в настоящее время поддерживается только для файлов, загруженных через HTTP(S)/FTP.
    name: Возобновить загрузку
  daemon:
    name: Включить фоновый процесс
  deferred-input:
    description: Если установлено "Да", aria2 не будет читать все URI из файла, указанного в опции --input-file при запуске, а будет читать их только по мере необходимости. Если файл ввода содержит большое количество URI для загрузки, эта опция может снизить использование памяти. Если установлено "Нет", aria2 будет читать все URI при запуске. Опция --deferred-input будет отключена при использовании --save-session.
    name: Отложенная загрузка
  dht-file-path:
    description: Изменяет путь к файлу таблицы маршрутизации DHT IPv4.
    name: Файл DHT (IPv4)
  dht-file-path6:
    description: Изменяет путь к файлу таблицы маршрутизации DHT IPv6.
    name: Файл DHT (IPv6)
  dht-listen-port:
    description: 'Устанавливает UDP порт, используемый DHT (IPv4, IPv6) и UDP сервером. Несколько портов можно разделить запятыми ",", например: 6881,6885. Также можно использовать тире "-" для указания диапазона: 6881-6999, или оба вместе: 6881-6889, 6999.'
    name: Порт прослушивания DHT
  dht-message-timeout:
    name: Тайм-аут сообщения DHT
  dir:
    name: Путь загрузки
  disable-ipv6:
    name: Отключить IPv6
  disk-cache:
    description: Включает дисковый кеш. Если установлено 0, дисковый кеш будет отключен. Эта функция кеширует загруженные данные в памяти до максимального значения, указанного в этой опции. Память для кеша создается экземпляром aria2 и используется всеми загрузками. Так как данные записываются большими блоками и упорядочиваются по смещениям в файле, одним из преимуществ дискового кеша является уменьшение дискового ввода-вывода. Если вызывается проверка хэша, и данные находятся в памяти, то нет необходимости считывать их с диска. Размер может включать K или M (1K=1024, 1M=1024K).
    name: Дисковый кеш
  download-result:
    description: Эта опция изменяет формат результата загрузки. Если установлено "По умолчанию", будет напечатан GID, статус, средняя скорость загрузки и путь/URI. Если задействовано несколько файлов, будет напечатан только путь/URI первого запрашиваемого файла, остальные будут проигнорированы. Если установлено "Полный", будет напечатан GID, статус, средняя скорость загрузки, прогресс загрузки и путь/URI. В этом случае прогресс загрузки и путь/URI будут напечатаны в одной строке для каждого файла. Если установлено "Скрытый", результат загрузки будет скрыт.
    name: Результат загрузки
  dry-run:
    description: Если установлено "да", aria2 только проверит наличие удаленного файла без загрузки его содержимого. Эта опция действует только для HTTP/FTP загрузок. Если установлено true, BT загрузки будут немедленно прерваны.
    name: Пробный запуск
  dscp:
    description: Устанавливает значение DSCP для поля TOS в исходящих BT пакетах для QoS. Этот параметр устанавливает только биты DSCP поля TOS, а не все поле целиком. Если значения получены из /usr/include/netinet/ip.h, их нужно разделить на 4 (иначе значения будут неверными, например, класс CS1 станет CS4). Если используются стандартные значения из RFC, документации поставщика сети, Wikipedia или других источников, их можно использовать напрямую.
    name: DSCP
  enable-color:
    name: Использовать цвета в выводе терминала
  enable-dht:
    description: Включает функцию DHT IPv4. Эта опция также включает поддержку UDP сервера. Если торрент помечен как частный, aria2 не включит DHT, даже если эта опция установлена на "да".
    name: Включить DHT (IPv4)
  enable-dht6:
    description: Включает функцию DHT IPv6. Если торрент помечен как частный, aria2 не включит DHT, даже если эта опция установлена на "да". Используйте опцию --dht-listen-port для установки порта прослушивания.
    name: Включить DHT (IPv6)
  enable-http-keep-alive:
    description: Включает keep-alive HTTP/1.1.
    name: Включить HTTP keep-alive
  enable-http-pipelining:
    description: Включает HTTP/1.1 pipelining.
    name: Включить HTTP pipelining
  enable-mmap:
    description: Кеширует файлы, отображенные в память. Если пространство файла не выделено заранее, эта опция недействительна. См. --file-allocation.
    name: Включить MMap
  enable-peer-exchange:
    description: Включает расширение обмена пирамид. Если торрент помечен как частный, aria2 не включит эту функцию, даже если эта опция установлена на "да".
    name: Включить обмен пирамид
  enable-rpc:
    name: Включить сервер JSON-RPC/XML-RPC
  event-poll:
    description: Устанавливает метод опроса событий. Возможные значения включают epoll, kqueue, port, poll и select. Для epoll, kqueue, port и poll доступны только если система их поддерживает. Большинство дистрибутивов Linux поддерживают epoll. Различные системы *BSD, включая Mac OS X, поддерживают kqueue. Open Solaris поддерживает port. Значение по умолчанию зависит от используемой операционной системы.
    name: Метод опроса событий
  file-allocation:
    description: Задает метод выделения файлов. "None" не выделяет пространство файла заранее. "Prealloc" выделяет пространство перед началом загрузки. Это займет время в зависимости от размера файла. Если используется современная файловая система, такая как ext4 (с расширенной поддержкой), btrfs, xfs или NTFS (только сборка MinGW), "falloc" - лучший выбор. Может выделить большие файлы (несколько GiB) почти мгновенно. Не используйте falloc на устаревших файловых системах, таких как ext3 и FAT32, так как требуется столько же времени, сколько и prealloc, и aria2 будет заблокирован до завершения выделения. falloc может быть недоступен, если система не поддерживает функцию posix_fallocate(3). "Trunc" использует системный вызов ftruncate(2) или платформенно-специфичную реализацию для усечения файла до определенной длины. В загрузках BitTorrent с несколькими файлами, если файл делит те же секции с соседним файлом, также будут выделены соседние файлы.
    name: Метод выделения файла
  follow-metalink:
    description: Если установлено на "Да" или "Только память", когда файл с суффиксом .meta4 или .metalink или с типом содержимого application/metalink4+xml или application/metalink+xml будет завершен, aria2 прочитает и загрузит файлы, указанные в файле Metalink. Если установлено на "Только память", файл Metalink не будет записан на диск, а только сохранен в памяти. Если установлено на "Нет", файл .metalink будет загружен на диск, но не будет прочитан, и файлы, содержащиеся в нем, не будут загружены.
    name: Загрузка файлов из Metalink
  follow-torrent:
    description: Если установлено "Да" или "Только память", то при завершении загрузки файла с суффиксом .torrent или с типом содержимого application/x-bittorrent, aria2 прочитает и загрузит файлы, указанные в файле torrent. Если установлено "Только память", файл torrent не будет записан на диск, а только сохранен в памяти. Если установлено "Нет", файл .torrent будет загружен на диск, но не будет прочитан, и файлы, указанные в нем, не будут загружены.
    name: Скачать файлы в торренте
  force-save:
    description: Сохраняет задание, даже если оно завершено или удалено при использовании опции --save-session. В этом случае эта опция также сохранит контрольный файл. Эта опция может сохранить задачи BT, которые считаются завершенными, но все еще находятся на раздаче.
    name: Принудительное сохранение
  ftp-passwd:
    description: Если URI содержит только имя пользователя без пароля, aria2 сначала попытается найти пароль в файле .netrc. Если пароль найден в файле .netrc, он будет использован. В противном случае будет использован пароль, установленный с помощью этой опции.
    name: Пароль FTP по умолчанию
  ftp-pasv:
    description: Использует пассивный режим в FTP. Если установлено значение "нет", будет использован активный режим. Эта опция не применяется к передачам SFTP.
    name: Пассивный режим
  ftp-proxy-passwd:
    name: Пароль прокси-сервера FTP
  ftp-proxy-user:
    name: Имя пользователя прокси-сервера FTP
  ftp-proxy:
    name: Прокси-сервер FTP
  ftp-reuse-connection:
    name: Повторное использование соединения
  ftp-type:
    description: Задаёт тип передачи FTP, binary или ascii. Значение по умолчанию — binary. Для SFTP эта опция игнорируется.
    name: Тип передачи
  ftp-user:
    name: Имя пользователя FTP по умолчанию
  hash-check-only:
    description: Если установлено "Да", завершает загрузку на основании завершения загрузки после выполнения проверки хэша с помощью опции --check-integrity.
    name: Только проверка хэша
  header:
    description: 'Добавляет содержимое заголовка HTTP запроса. Каждая строка представляет опцию, содержащую "имя заголовка: значение заголовка".'
    name: Пользовательские заголовки
  http-accept-gzip:
    description: 'Если заголовок ответа удаленного сервера включает Content-Encoding: gzip или Content-Encoding: deflate, отправляет запросы с заголовками Accept: deflate, gzip и распаковывает ответ.'
    name: Принимать GZip
  http-auth-challenge:
    description: 'Отправляет заголовки запросов аутентификации HTTP только по запросу сервера. Если установлено значение "нет", всегда отправляет заголовки запросов аутентификации. Исключение: если имя пользователя и пароль включены в URI, эта опция игнорируется, и заголовки запросов аутентификации отправляются всегда.'
    name: Вызов аутентификации HTTP
  http-no-cache:
    description: 'Заголовки запросов будут содержать Cache-Control: no-cache и Pragma: no-cache, чтобы избежать кеширования. Если установлено значение "нет", вышеуказанные заголовки запросов не будут отправлены, и опция --header может быть использована для добавления заголовка Cache-Control.'
    name: Отключить кеш
  http-passwd:
    name: Пароль HTTP по умолчанию
  http-proxy-passwd:
    name: Пароль прокси-сервера HTTP
  http-proxy-user:
    name: Имя пользователя прокси-сервера HTTP
  http-proxy:
    name: Прокси-сервер HTTP
  http-user:
    name: Имя пользователя HTTP по умолчанию
  https-proxy-passwd:
    name: Пароль прокси-сервера HTTPS
  https-proxy-user:
    name: Имя пользователя прокси-сервера HTTPS
  https-proxy:
    name: Прокси-сервер HTTPS
  human-readable:
    description: Печатает размеры и скорость в читаемом формате (например, 1.2Ki, 3.4Mi).
    name: Читаемый вывод в консоль
  keep-unfinished-download-result:
    description: Сохраняет все результаты незавершенных задач загрузки, даже если они превышают количество, установленное опцией --max-download-result. Это может помочь сохранить все незавершенные загрузки в файле сессии (см. опцию --save-session). Важно отметить, что нет ограничения на количество незавершенных задач. Если это не требуется, отключите эту опцию.
    name: Сохранять результаты незавершенных задач
  listen-port:
    description: 'Устанавливает порт TCP для загрузок BT. Несколько портов могут быть разделены запятыми ",", например: 6881,6885. Также можно использовать дефис "-" для указания диапазона: 6881-6999, или их комбинацию: 6881-6889, 6999.'
    name: Порт прослушивания
  log-level:
    name: Уровень логов
  log:
    description: Путь к файлу логов. Если установлено "-", логи будут записаны в stdout. Если установлено пустое значение (""), логи не будут сохраняться на диск.
    name: Файл логов
  lowest-speed-limit:
    description: Закрывает соединение, если скорость загрузки ниже установленного значения (в Б/с). 0 означает отсутствие минимального лимита скорости. Можно добавлять единицы измерения, такие как K или M (1K=1024, 1M=1024K). Эта опция не влияет на BT загрузки.
    name: Минимальный лимит скорости
  max-concurrent-downloads:
    name: Максимальное количество одновременных загрузок
  max-connection-per-server:
    name: Максимальное количество соединений на сервер
  max-download-limit:
    description: Устанавливает максимальную скорость загрузки для каждой задачи (байт/сек). 0 означает отсутствие ограничений. Можно увеличить значение, добавив единицы K или M (1K=1024, 1M=1024K).
    name: Максимальная скорость загрузки
  max-download-result:
    description: Устанавливает максимальное количество результатов загрузок, сохраняемых в памяти. Результаты загрузок включают завершённые, с ошибками или удалённые загрузки. Результаты сохраняются в очереди FIFO, что позволяет хранить не более указанного количества записей. Когда очередь заполнена и создаётся новый результат загрузки, самый старый результат удаляется из начала очереди, а новый добавляется в конец. Установка большого значения для этой опции может привести к высокому потреблению памяти, если выполняются тысячи загрузок. Установите 0, чтобы не сохранять результаты загрузок. Обратите внимание, что незавершённые загрузки всегда будут сохраняться в памяти, независимо от настройки этой опции. См. также опцию --keep-unfinished-download-result.
    name: Максимальное количество результатов загрузки
  max-file-not-found:
    description: Если aria2 получает статус "файл не найден" от удаленного HTTP/FTP сервера больше раз, чем установлено в этой опции, загрузка завершится с ошибкой. Установка 0 отключит эту опцию. Эта опция влияет только на HTTP/FTP серверы. Повторные попытки будут записаны вместе с количеством попыток, поэтому необходимо установить опцию --max-tries.
    name: Попытки повторного поиска файла не найдены
  max-mmap-limit:
    description: Устанавливает максимальный размер файла для включения MMap (см. опцию --enable-mmap). Размер файла определяется суммой всех размеров файлов в задаче загрузки. Например, если загрузка содержит 5 файлов, размер файла будет общей суммой этих файлов. Если размер файла превышает установленный для этой опции, MMap будет отключен.
    name: Максимальный лимит MMap
  max-overall-download-limit:
    description: Устанавливает максимальную глобальную скорость загрузки (байт/сек). 0 означает отсутствие ограничений. Можно увеличить значение, добавив единицы K или M (1K=1024, 1M=1024K).
    name: Максимальная глобальная скорость загрузки
  max-overall-upload-limit:
    description: Устанавливает максимальную глобальную скорость отдачи в байтах/секунду. 0 означает отсутствие ограничений. Можно увеличить значение, добавив единицы K или M (1K=1024, 1M=1024K).
    name: Максимальная глобальная скорость отдачи
  max-resume-failure-tries:
    description: Когда опция --always-resume установлена на "Нет", если aria2 обнаруживает, что N URI не поддерживают возобновление прерванных загрузок, загрузка файла начнется с начала. Если N установлено на 0, загрузка файла начнется с начала только если все URI не поддерживают возобновление прерванных загрузок. См. опцию --always-resume.
    name: Максимальное количество попыток возобновления прерванных загрузок
  max-tries:
    description: Устанавливает максимальное количество попыток. 0 означает отсутствие ограничений.
    name: Максимальное количество попыток
  max-upload-limit:
    description: Устанавливает максимальную скорость отдачи для каждой задачи в байтах/секунду. 0 означает отсутствие ограничений. Можно увеличить значение, добавив единицы K или M (1K=1024, 1M=1024K).
    name: Максимальная скорость отдачи
  metalink-base-uri:
    description: Задает базовый URI для разрешения относительных URI адресов metalink:url и metalink:metaurl в файлах Metalink, хранящихся на локальном диске. Если URI представляет каталог, он должен заканчиваться на /.
    name: Базовый URI
  metalink-enable-unique-protocol:
    description: Если файл Metalink доступен по нескольким протоколам и эта опция установлена на "Да", aria2 будет использовать только один. Используйте параметр --metalink-preferred-protocol для указания предпочитаемого протокола.
    name: Использовать только один уникальный протокол
  metalink-language:
    name: Язык
  metalink-location:
    description: 'Предпочитаемое расположение сервера. Можно использовать список, разделенный запятыми, например: jp,us.'
    name: Предпочитаемое расположение сервера
  metalink-os:
    description: Операционная система файла для загрузки.
    name: Операционная система
  metalink-preferred-protocol:
    description: Задает предпочитаемый для использования протокол. Можно установить http, https, ftp или "нет". Если установлено на "нет", эта опция отключена.
    name: Предпочитаемый протокол
  metalink-version:
    description: Номер версии файла для загрузки.
    name: Номер версии
  min-split-size:
    description: 'aria2 не будет делить файлы размером меньше 2*РАЗМЕР байт. Например, если размер файла 20 МБ, а РАЗМЕР равен 10M, aria2 разделит файл на 2 сегмента [0-10MB) и [10MB-20MB) и будет использовать 2 источника для загрузки (если --split >= 2). Если РАЗМЕР равен 15M, то, поскольку 2*15M > 20MB, aria2 не будет делить файл и использует 1 источник для загрузки. Можно указывать единицы измерения, такие как K или M (1K=1024, 1M=1024K). Допустимые значения: от 1M до 1024M.'
    name: Минимальный размер деления файла
  min-tls-version:
    description: Указывает минимальную версию SSL/TLS.
    name: Минимальная версия TLS
  netrc-path:
    name: Путь к файлу .netrc
  no-conf:
    name: Отключить файл конфигурации
  no-file-allocation-limit:
    description: Не сравнивает выделенные файлы с этим лимитом размера. Можно увеличить значение, добавив единицы K или M (1K=1024, 1M=1024K).
    name: Лимит выделения файлов
  no-netrc:
    name: Отключить netrc
  no-proxy:
    description: Устанавливает имена хостов, доменные имена, сетевые адреса с маской подсети или без нее, для которых не использовать прокси-сервер. Используйте запятую для разделения нескольких записей.
    name: Список серверов, для которых не использовать прокси
  no-want-digest-header:
    description: При true aria2 не посылает заголовок Want-Digest в запросах. Значение по умолчанию — false.
    name: Не отправлять заголовок Want-Digest
  optimize-concurrent-downloads:
    description: Оптимизирует количество одновременных загрузок в зависимости от доступной пропускной способности. aria2 использует ранее измеренную скорость загрузки для получения количества одновременных загрузок с помощью правила N=A + B Log10 (скорость в Мбит/с). Коэффициенты A и B можно настроить, разделив их двоеточием в параметре. Значение по умолчанию (A=5, B=25) может использовать 5 одновременных загрузок в сети 1 Мбит/с и 50 в сети 100 Мбит/с. Количество одновременных загрузок ограничено максимумом, определенным параметром --max-concurrent-downloads.
    name: Оптимизация одновременных загрузок
  out:
    description: Имя загруженного файла. Оно всегда относительно пути, установленного опцией --dir. Эта опция недействительна при использовании опции --force-sequential.
    name: Имя файла
  parameterized-uri:
    description: 'Включает поддержку параметризованных URI. Можно указать набор частей: http://{sv1,sv2,sv3}/foo.iso. Также можно использовать шаговый счетчик для указания числовых последовательностей: http://host/image[000-100:2].img. Шаговый счетчик необязателен. Если все URI не указывают на один и тот же файл, как во втором примере выше, необходимо использовать опцию -Z.'
    name: Включить поддержку параметризованных URI
  pause-metadata:
    description: 'Приостанавливает последующие загрузки после загрузки торрент-файла. В aria2 есть 3 типа загрузки торрент-файлов: (1) Загрузка файлов .torrent. (2) Торрент-файлы, загруженные через магнитные ссылки. (3) Загрузка файлов Metalink. Эти торрент-файлы после загрузки продолжат загружаться в зависимости от содержимого файла. Эта опция приостановит эти последующие загрузки. Эта опция эффективна только если опция --enable-rpc включена.'
    name: Приостановить после загрузки торрент-файла
  peer-agent:
    description: Устанавливает строку User-Agent, которую будет использовать aria2 при соединении с пирами для передачи данных.
    name: Агент пира
  peer-id-prefix:
    description: Задает префикс для идентификатора узла. Идентификатор узла в BT имеет длину 20 байт. Если он превышает 20 байт, будут использованы только первые 20 байт. Если он короче 20 байт, будут добавлены случайные данные, чтобы достичь 20 байт.
    name: Префикс идентификатора узла
  piece-length:
    description: Устанавливает размер блока для загрузок HTTP/FTP. aria2 делит файлы по этому лимиту. Все сегменты будут кратны этой длине. Эта опция не действует для загрузок BitTorrent.
    name: Размер блока файла
  proxy-method:
    description: Устанавливает метод запроса для использования прокси-сервером. Метод может быть установлен как GET или TUNNEL. Загрузки HTTPS игнорируют эту опцию и всегда используют TUNNEL.
    name: Метод запроса прокси-сервера
  quiet:
    name: Отключить вывод консоли
  realtime-chunk-checksum:
    description: Если предоставлена контрольная сумма блока данных, проверяет блоки данных с контрольной суммой во время загрузки.
    name: Контроль целостности данных в реальном времени
  referer:
    description: Устанавливает заголовок Referer, который будет отправляться при запросах к веб-серверу. Это может быть полезно для имитации настоящих запросов из браузера.
    name: Referer
  remote-time:
    description: Получает временную метку удаленного файла от HTTP/FTP службы и устанавливает ее на локальный файл, если доступно
    name: Получить время файла с сервера
  remove-control-file:
    description: Удаляет контрольный файл перед загрузкой. В сочетании с опцией --allow-overwrite=true, загрузка файла всегда начнется с начала. Эта опция может быть полезна пользователям, которые используют прокси, не поддерживающие возобновление загрузок.
    name: Удалить контрольный файл
  retry-wait:
    description: Устанавливает интервал времени (в секундах) между попытками повторной попытки. Когда установлено значение больше 0, aria2 будет пытаться снова при получении ответа 503 от HTTP сервера.
    name: Время ожидания перед повторной попыткой
  reuse-uri:
    description: Когда все предоставленные URI использованы, продолжайте использовать уже использованные URI.
    name: Повторное использование URI
  rlimit-nofile:
    description: 'Устанавливает мягкий лимит на количество открытых файловых дескрипторов. Эта опция эффективна только если: a. Система поддерживает (POSIX). b. Лимит не превышает жесткий лимит. c. Указанный лимит больше текущего мягкого лимита. Это эквивалентно установке ulimit, но не может снизить лимит. Эта опция эффективна только если система поддерживает API rlimit.'
    name: Максимальное количество открытых файловых дескрипторов
  rpc-allow-origin-all:
    description: Добавляет поле Access-Control-Allow-Origin в заголовок ответа RPC со значением *.
    name: Принимать все удаленные запросы
  rpc-listen-all:
    description: Прослушивает запросы JSON-RPC/XML-RPC на всех сетевых интерфейсах. Если установлено на "Нет", прослушивает только запросы из локальной сети.
    name: Прослушивать на всех сетевых интерфейсах
  rpc-listen-port:
    name: Порт прослушивания
  rpc-max-request-size:
    description: Устанавливает максимальный размер запроса JSON-RPC/XML-RPC. Если aria2 обнаруживает, что запрос превышает установленное количество байт, соединение будет сразу закрыто.
    name: Максимальный размер запроса
  rpc-save-upload-metadata:
    description: Сохраняет загруженные торрент или Metalink файлы в директорию, указанную опцией dir. Имя файла состоит из метаданных хэша SHA-1 и расширения. Для торрент-файлов расширение .torrent. Для Metalink - .meta4. Если эта опция установлена на "Нет", загрузки, добавленные через методы aria2.addTorrent() или aria2.addMetalink(), не могут быть сохранены с опцией --save-session.
    name: Сохранять загруженные торрент-файлы
  rpc-secure:
    description: RPC будет передаваться через шифрование SSL/TLS. Клиент RPC должен использовать протокол https для подключения к серверу. Для WebSocket клиентов используйте протокол wss. Используйте опции --rpc-certificate и --rpc-private-key для установки сертификата и приватного ключа сервера.
    name: Включить SSL/TLS
  save-cookies:
    description: Сохраняет cookie в файл в формате Mozilla/Firefox(1.x/2.x)/Netscape. Если файл уже существует, он будет перезаписан. Истекшие cookie также будут сохранены, но их время истечения будет установлено на 0.
    name: Путь сохранения cookie
  save-not-found:
    description: При использовании опции --save-session сохраняет задание загрузки, даже если файлы в задании отсутствуют. Эта опция также сохранит эту ситуацию в контрольном файле.
    name: Сохранять ненайденные файлы
  save-session-interval:
    description: Сохраняет загрузки с ошибками или незавершенные загрузки в файл, указанный в опции --save-session, через указанные секунды. Если установлено на 0, сессия будет сохранена только при выходе aria2.
    name: Интервал сохранения сессии
  save-session:
    description: Сохраняет загрузки с ошибками и незавершенные загрузки в указанный файл при выходе. Можно перезагрузить их с помощью опции --input-file при перезапуске aria2. Если хотите сжать вывод с помощью GZip, можно добавить расширение .gz к имени файла. Обратите внимание, что метаданные загрузок, добавленных через методы RPC aria2.addTorrent() и aria2.addMetalink(), не будут сохранены, если не сохранены в файл. Загрузки, удаленные с помощью aria2.remove() и aria2.forceRemove(), не будут сохранены.
    name: Файл сохранения сессии
  seed-ratio:
    description: Задает соотношение раздачи. Раздача прекращается, когда соотношение раздачи достигает значения, установленного в этой опции. Настоятельно рекомендуется установить это значение на уровень выше или равный 1.0. Если не желаете ограничивать соотношение раздачи, можно установить на 0.0. Если также установлена опция --seed-time, раздача завершится, когда одно из условий будет выполнено.
    name: Минимальное соотношение раздачи
  seed-time:
    description: Задает время раздачи в минутах (в десятичном формате). Если установлено на 0, раздача не произойдет после завершения загрузки задачи BT.
    name: Минимальное время раздачи
  server-stat-of:
    description: Указывает имя файла для сохранения состояния сервера. Можно использовать параметр --server-stat-if для чтения сохраненных данных.
    name: Сохранить состояние сервера
  server-stat-timeout:
    description: Указывает время истечения состояния сервера (в секундах).
    name: Тайм-аут состояния сервера
  show-console-readout:
    name: Отображение данных консоли
  socket-recv-buffer-size:
    description: Устанавливает максимальный размер буфера приема сокета в байтах. Если установлено на 0, эта опция отключена. Значение этой опции устанавливается на дескриптор файла сокета при вызове setsockopt() с опцией SO_RCVBUF.
    name: Размер буфера приема сокета
  split:
    description: Использует N соединений для загрузки. Если предоставлены более N URI адресов, будут использованы первые N адресов, остальные будут использоваться как резервные. Если предоставлено меньше N URI адресов, они будут повторно использоваться для обеспечения одновременной активности N соединений. Количество соединений к одному серверу ограничено опцией --max-connection-per-server.
    name: Соединения для загрузки
  ssh-host-key-md:
    description: 'Устанавливает контрольную сумму публичного ключа SSH сервера. Формат опции: TIPO=DIGEST. TIPO - это тип хэша. Поддерживаемые типы хэшей: sha-1 и md5. DIGEST - это шестнадцатеричный дайджест. Например: sha-1=b030503d4de4539dc7885e6f0f5e256704edf4c3. Эта опция может быть использована для проверки публичного ключа сервера при использовании SFTP. Если эта опция не установлена, будет использована проверка по умолчанию.'
    name: Контрольная сумма публичного ключа SSH
  stop:
    description: Останавливает все активные загрузки и завершает работу aria2.
    name: Время автоматической остановки
  stream-piece-selector:
    description: Указывает алгоритм выбора частей для загрузки HTTP/FTP. Части - это сегменты фиксированной длины во время параллельной загрузки. Если установлено значение "по умолчанию", aria2 выберет части, уменьшая количество соединений. Так как создание соединений затратно, это разумное поведение по умолчанию. Если установлено значение "последовательно", aria2 выберет части с наименьшим индексом. Индекс 0 указывает на первую часть файла. Это полезно для потокового видео. Опция --enable-http-pipelining помогает уменьшить расходы на переподключение. Обратите внимание, что aria2 зависит от опции --min-split-size, поэтому необходимо установить разумное значение для --min-split-size. Если установлено значение "случайно", aria2 выберет случайную часть. Как и "последовательно", зависит от опции --min-split-size. Если установлено значение "геометрически", aria2 сначала выберет часть с наименьшим индексом, затем зарезервирует место для выбранных ранее частей, используя экспоненциальный рост. Это уменьшит количество соединений, в то время как первые части файла будут загружаться первыми. Это также полезно для потокового видео.
    name: Алгоритм выбора частей
  summary-interval:
    description: Устанавливает интервал вывода сводки прогресса загрузки (в секундах). Установите на 0, чтобы отключить вывод.
    name: Интервал вывода сводки загрузки
  timeout:
    name: Тайм-аут
  truncate-console-readout:
    description: Обрезает вывод консоли до одной строки.
    name: Обрезка вывода консоли
  uri-selector:
    description: Указывает алгоритм выбора URI. Возможные значения включают "последовательно", "отзыв" и "адаптивно". Если установлено значение "последовательно", URI будут использоваться в порядке их появления в списке. Если установлено значение "отзыв", aria2 выберет сервер с самой быстрой скоростью загрузки из списка URI, игнорируя недействительные зеркала. Предыдущая измеренная скорость загрузки будет частью файла состояния сервера, см. опции --server-stat-of и --server-stat-if. Если установлено значение "адаптивно", будет выбран лучший зеркало и ожидающее соединение. Обратите внимание, что возвращенные зеркала не проверены и будут повторно проверены только если все зеркала уже были проверены. Например, "отзыв" использует файл состояния сервера.
    name: Алгоритм выбора URI
  use-head:
    description: Использует метод HEAD при первом запросе к HTTP серверу.
    name: Использовать метод HEAD
  user-agent:
    name: Пользовательский агент
