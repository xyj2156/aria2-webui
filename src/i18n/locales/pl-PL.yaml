options:
  all-proxy-passwd:
    name: Hasło proxy
  all-proxy-user:
    name: Nazwa użytkownika proxy
  all-proxy:
    description: Użyj serwera proxy dla wszystkich protokołów. Możesz również zastąpić to ustawienie i określić serwer proxy dla konkretnego protokołu, używając --http-proxy, --https-proxy i --ftp-proxy. Wpływa to na wszystkie pobierania. Format PROXY to [http://][USER:PASSWORD@]HOST[:PORT].
    name: Serwer proxy
  allow-overwrite:
    description: Rozpocznij pobieranie od początku, jeśli nie istnieje odpowiedni plik kontrolny. Zobacz także opcję --auto-file-renaming.
    name: Zezwól na Nadpisywanie
  allow-piece-length-change:
    description: Jeśli ustawione na false, aria2 przerywa pobieranie, gdy długość części różni się od tej w pliku kontrolnym. Jeśli ustawione na true, pobieranie może być kontynuowane, ale część postępu zostanie utracona.
    name: Zezwól na Zmianę Długości Części
  always-resume:
    description: Zawsze wznawiaj pobieranie. Jeśli ustawione na true, aria2 zawsze próbuje wznowić pobieranie i jeśli nie jest to możliwe, przerywa je. Jeśli ustawione na false, gdy wszystkie podane URI nie obsługują wznawiania lub aria2 napotka N URI, które nie obsługują wznawiania (gdzie N to wartość opcji --max-resume-failure-tries), aria2 pobiera plik od początku. Zobacz opcję --max-resume-failure-tries.
    name: Zawsze Wznawiaj Pobieranie
  async-dns:
    name: Asynchroniczny DNS
  auto-file-renaming:
    description: Zmienia nazwę pliku, jeśli plik o tej samej nazwie już istnieje. Opcja działa tylko w pobieraniu HTTP(S)/FTP. Nowa nazwa pliku ma dodaną kropkę i numer (1..9999) przed rozszerzeniem pliku, jeśli istnieje.
    name: Automatyczna Zmiana Nazwy Pliku
  auto-save-interval:
    description: Zapisuje plik kontrolny (*.aria2) co SEC sekund. Jeśli ustawione na 0, plik kontrolny nie jest zapisywany podczas pobierania. aria2 zapisuje plik kontrolny po zatrzymaniu, niezależnie od tej wartości. Możliwe wartości to od 0 do 600.
    name: Automatyczny Interwał Zapisu
  bt-detach-seed-only:
    description: Wyklucz pobrania będące tylko w trybie seedowania przy liczeniu aktywnych pobrań (patrz opcja -j). Oznacza to, że jeśli podano -j3 i ta opcja jest włączona, a 3 pobrania są aktywne, a jedno przejdzie w tryb seedowania, zostaje ono wykluczone z liczenia aktywnych pobrań (stając się 2), co pozwala na uruchomienie kolejnego pobrania z kolejki. Należy jednak pamiętać, że w metodzie RPC element seedujący nadal jest uznawany za aktywne pobranie.
    name: Oddziel tylko seedowanie
  bt-enable-hook-after-hash-check:
    description: Zezwól na wykonanie polecenia hook po sprawdzeniu hasha (patrz opcja -V) w pobraniach BitTorrent. Domyślnie, jeśli weryfikacja hasha zakończy się sukcesem, wykonywane jest polecenie określone w opcji --on-bt-download-complete. Aby wyłączyć tę akcję, ustaw tę opcję na false.
    name: Włącz hook po sprawdzeniu hasha
  bt-enable-lpd:
    name: Włącz Local Peer Discovery (LPD)
  bt-exclude-tracker:
    description: Lista oddzielona przecinkami z URI trackerów BitTorrent do usunięcia. Można użyć specjalnej wartości *, która pasuje do wszystkich URI i usuwa wszystkie ogłoszenia trackerów. Przy używaniu * w wierszu poleceń powłoki nie zapomnij go uciec lub umieścić w cudzysłowie.
    name: Wyklucz trackery BitTorrent
  bt-external-ip:
    description: Określ zewnętrzny adres IP do użycia w pobraniach BitTorrent i DHT. Może być wysyłany do trackera BitTorrent. W przypadku DHT ta opcja powinna być ustawiona, aby zgłosić, że lokalny węzeł pobiera określony torrent. Jest to kluczowe do użycia DHT w sieci prywatnej. Chociaż funkcja nosi nazwę "zewnętrzna", akceptuje dowolne adresy IP.
    name: Zewnętrzny adres IP
  bt-force-encryption:
    description: Wymaga szyfrowania ładunku wiadomości BitTorrent przy użyciu arc4. Jest to skrót dla --bt-require-crypto --bt-min-crypto-level=arc4. Ta opcja nie zmienia wartości tych opcji. Jeśli ustawione na true, aria2 odrzuca tradycyjny handshake BitTorrent i używa tylko Obfuscation handshake, zawsze szyfrując ładunek wiadomości.
    name: Wymuś szyfrowanie
  bt-hash-check-seed:
    description: Jeśli ustawione na true, po sprawdzeniu hasha przy użyciu opcji --check-integrity i ukończeniu pliku, aria2 kontynuuje jego seedowanie. Jeśli chcesz sprawdzić plik i pobrać go tylko wtedy, gdy jest uszkodzony lub niekompletny, ustaw tę opcję na false. Ta opcja ma zastosowanie tylko do pobrań BitTorrent.
    name: Sprawdzenie hasha przed seedowaniem
  bt-load-saved-metadata:
    description: Przed pobraniem metadanych torrenta z DHT przy pobieraniu za pomocą linku magnet, najpierw spróbuj odczytać plik zapisany przez opcję --bt-save-metadata. Jeśli się powiedzie, pominięte zostanie pobieranie metadanych z DHT.
    name: Wczytaj zapisany plik metadanych
  bt-max-open-files:
    description: Określ maksymalną liczbę otwartych plików w globalnym pobieraniu BitTorrent/Metalink.
    name: Maksymalna liczba otwartych plików
  bt-max-peers:
    description: Określ maksymalną liczbę peerów na torrent. 0 oznacza brak ograniczeń.
    name: Maksymalna liczba peerów
  bt-metadata-only:
    description: Pobieraj tylko metadane. Pliki opisane w metadanych nie będą pobierane. Ta opcja działa tylko w przypadku korzystania z BitTorrent Magnet URI.
    name: Pobieraj tylko metadane
  bt-min-crypto-level:
    description: Ustaw minimalny poziom metody szyfrowania. Jeśli peer oferuje kilka metod szyfrowania, aria2 wybiera najniższy poziom spełniający podane wymagania.
    name: Minimalny poziom szyfrowania
  bt-prioritize-piece:
    description: 'Spróbuj pobrać najpierw pierwsze i ostatnie fragmenty każdego pliku. Jest to przydatne do podglądu plików. Argument może zawierać dwa słowa kluczowe: head i tail. Aby użyć obu, należy je oddzielić przecinkiem. Można także określić rozmiar, np. head=ROZMIAR oznacza nadanie wyższego priorytetu fragmentom z pierwszych ROZMIAR bajtów każdego pliku. tail=ROZMIAR odnosi się do ostatnich bajtów. ROZMIAR może być podany w K lub M (1K = 1024, 1M = 1024K).'
    name: Priorytetowe fragmenty
  bt-remove-unselected-file:
    description: Usuwa nieoznaczone pliki po zakończeniu pobierania torrenta. Aby wybrać pliki, użyj opcji --select-file. Jeśli nie zostanie użyta, wszystkie pliki są traktowane jako wybrane. Używaj tej opcji ostrożnie, ponieważ pliki zostaną faktycznie usunięte z dysku.
    name: Usuń nieoznaczone pliki
  bt-request-peer-speed-limit:
    description: Jeśli całkowita prędkość pobierania wszystkich torrentów jest niższa niż SPEED, aria2 tymczasowo zwiększa liczbę peerów w celu uzyskania większej prędkości. Możesz dodać K lub M (1K = 1024, 1M = 1024K).
    name: Preferowana prędkość pobierania
  bt-require-crypto:
    description: Jeśli ustawione na true, aria2 nie akceptuje i nie nawiązuje połączeń przy użyciu przestarzałego BitTorrent handshake (\19BitTorrent protocol). Zamiast tego zawsze używa szyfrowania Obfuscation handshake.
    name: Wymagaj szyfrowania
  bt-save-metadata:
    description: Zapisz metadane jako plik .torrent. Ta opcja działa tylko przy użyciu BitTorrent Magnet URI. Nazwa pliku to zakodowany hash info z rozszerzeniem .torrent. Plik zostanie zapisany w tym samym katalogu co pobierany plik. Jeśli taki plik już istnieje, metadane nie zostaną zapisane.
    name: Zapisz metadane
  bt-seed-unverified:
    description: Udostępniaj wcześniej pobrane pliki bez weryfikacji ich sum kontrolnych.
    name: Nie weryfikuj pobranych plików
  bt-stop-timeout:
    description: Zatrzymaj pobieranie torrenta, jeśli prędkość pobierania wynosi 0 przez kolejne SEC sekund. Wartość 0 wyłącza tę funkcję.
    name: Czas oczekiwania na zatrzymanie
  bt-tracker-connect-timeout:
    description: Ustaw czas oczekiwania (w sekundach) na nawiązanie połączenia z trackerem. Po nawiązaniu połączenia ta opcja nie ma już wpływu, zamiast tego stosowana jest opcja --bt-tracker-timeout.
    name: Czas oczekiwania na połączenie z trackerem
  bt-tracker-interval:
    description: Ustaw interwał (w sekundach) między zapytaniami do trackerów. Całkowicie nadpisuje wartość interwału zwróconą przez tracker. Wartość 0 pozwala aria2 określić interwał na podstawie odpowiedzi trackera i postępu pobierania.
    name: Interwał połączeń z trackerem
  bt-tracker-timeout:
    name: Limit czasu trackera
  bt-tracker:
    description: Lista dodatkowych trackerów BitTorrenta oddzielonych przecinkami. Te adresy nie są usuwane przez opcję --bt-exclude-tracker, ponieważ są dodawane po zastosowaniu tej opcji.
    name: Trackery BitTorrenta
  check-certificate:
    name: Sprawdź certyfikat
  check-integrity:
    description: Sprawdź integralność pliku, weryfikując hashe fragmentów lub hash całego pliku. Ta opcja ma wpływ tylko na pobieranie BitTorrent, Metalink z sumami kontrolnymi lub pobieranie HTTP(S)/FTP z opcją --checksum.
    name: Sprawdź integralność
  checksum:
    description: 'Ustaw sumę kontrolną. Format wartości opcji to TYPE=DIGEST. TYPE to typ hasha. Obsługiwane typy hashów są wymienione w algorytmach hashujących w aria2c -v. DIGEST to szesnastkowy skrót. Na przykład ustawienie skrótu sha-1 wygląda tak: sha-1=0192ba11326fe2298c8cb4de616f4d4140213838. Ta opcja dotyczy tylko pobierania HTTP(S)/FTP.'
    name: Suma kontrolna
  conditional-get:
    description: Pobieraj plik tylko wtedy, gdy lokalny plik jest starszy niż zdalny. Funkcja ta działa tylko w przypadku pobierania przez HTTP(S). Nie działa, jeśli rozmiar pliku jest określony w Metalink. Ignoruje również nagłówek Content-Disposition. Jeśli istnieje plik kontrolny, ta opcja zostanie zignorowana. Funkcja ta używa nagłówka If-Modified-Since, aby warunkowo pobierać nowszy plik. Przy pobieraniu czasu modyfikacji lokalnego pliku używa nazwy pliku podanej przez użytkownika (patrz opcja --out) lub części nazwy pliku w URI, jeśli --out nie jest określona. Aby nadpisać istniejący plik, wymagane jest --allow-overwrite.
    name: Pobieranie warunkowe
  conf-path:
    name: Plik konfiguracyjny
  connect-timeout:
    description: Ustaw limit czasu w sekundach na nawiązanie połączenia z serwerem HTTP/FTP/proxy. Po nawiązaniu połączenia ta opcja nie ma wpływu, a zamiast niej używana jest opcja --timeout.
    name: Limit czasu połączenia
  console-log-level:
    name: Poziom logów konsoli
  content-disposition-default-utf8:
    description: Obsługuj cytowane ciągi w nagłówku Content-Disposition jako UTF-8 zamiast ISO-8859-1, na przykład parametr nazwy pliku, ale nie rozszerzoną wersję nazwy pliku.
    name: Użyj UTF-8 do obsługi Content-Disposition
  continue:
    description: Wznów pobieranie częściowo pobranego pliku. Użyj tej opcji, aby wznowić pobieranie rozpoczęte przez przeglądarkę internetową lub inny program, który pobiera pliki sekwencyjnie od początku. Obecnie ta opcja dotyczy tylko pobierania HTTP(S)/FTP.
    name: Wznów pobieranie
  daemon:
    name: Włącz Daemon
  deferred-input:
    description: Jeśli podano wartość true, aria2 nie odczytuje wszystkich URI i opcji z pliku określonego przez opcję --input-file przy uruchamianiu, lecz odczytuje je jeden po drugim, gdy są potrzebne później. Może to zmniejszyć zużycie pamięci, jeśli plik wejściowy zawiera wiele URI do pobrania. Jeśli podano false, aria2 odczytuje wszystkie URI i opcje przy uruchamianiu. Opcja --deferred-input zostanie wyłączona, gdy używana jest opcja --save-session.
    name: Odwleczone ładowanie
  dht-file-path:
    description: Zmień plik tablicy routingu DHT dla IPv4 na PATH.
    name: Plik DHT (IPv4)
  dht-file-path6:
    description: Zmień plik tablicy routingu DHT dla IPv6 na PATH.
    name: Plik DHT (IPv6)
  dht-listen-port:
    description: 'Ustaw port UDP używany przez DHT (IPv4, IPv6) oraz trackery UDP. Można określić wiele portów, np. 6881,6885. Można także podać zakres, np. 6881-6999. Obie metody można łączyć: 6881-6889,6999.'
    name: Port nasłuchiwania DHT
  dht-message-timeout:
    name: Czas oczekiwania na wiadomość DHT
  dir:
    name: Ścieżka pobierania
  disable-ipv6:
    name: Wyłącz IPv6
  disk-cache:
    description: Włącz cache dyskowy. Jeśli rozmiar SIZE wynosi 0, cache dyskowy jest wyłączony. Ta funkcja buforuje pobrane dane w pamięci, która rośnie do maksymalnego rozmiaru SIZE w bajtach. Przechowywanie cache jest tworzone dla instancji aria2 i dzielone przez wszystkie pobierania. Zaletą cache dyskowego jest zmniejszenie operacji I/O na dysku, ponieważ dane są zapisywane w większych jednostkach i są reorganizowane według przesunięcia pliku. Jeśli weryfikacja haszy jest zaangażowana, a dane są buforowane w pamięci, nie musimy ich ponownie odczytywać z dysku. SIZE może zawierać K lub M (1K = 1024, 1M = 1024K).
    name: Cache dyskowy
  download-result:
    description: Ta opcja zmienia sposób formatowania wyników pobierania. Jeśli OPT to domyślnie, wyświetlane będą GID, status, średnia prędkość pobierania oraz ścieżka/URI. Jeśli zaangażowane są wiele plików, wyświetlana jest ścieżka/URI pierwszego żądanego pliku, a pozostałe są pomijane. Jeśli OPT to pełne, wyświetlane będą GID, status, średnia prędkość pobierania, procent postępu oraz ścieżka/URI. Procent postępu i ścieżka/URI są wyświetlane dla każdego żądanego pliku w każdym wierszu. Jeśli OPT to ukryte, wyniki pobierania są ukryte.
    name: Wynik pobierania
  dry-run:
    description: Jeśli podano true, aria2 tylko sprawdza, czy zdalny plik jest dostępny, i nie pobiera danych. Ta opcja ma wpływ na pobieranie HTTP/FTP. Pobieranie BitTorrent jest anulowane, jeśli podano true.
    name: Symulacja
  dscp:
    description: Ustaw wartość DSCP w wychodzących pakietach IP dla ruchu BitTorrent dla QoS. Ten parametr ustawia tylko bity DSCP w polu TOS pakietów IP, a nie całe pole. Jeśli bierzesz wartości z /usr/include/netinet/ip.h, podziel je przez 4 (w przeciwnym razie wartości będą niepoprawne, np. twój klas CS1 stanie się CS4). Jeśli bierzesz powszechnie używane wartości z RFC, dokumentacji dostawców sieci, Wikipedii lub innych źródeł, użyj ich tak jak są.
    name: DSCP
  enable-color:
    name: Włącz kolor w terminalu
  enable-dht:
    description: Włącz funkcję DHT dla IPv4. Automatycznie włącza także wsparcie dla trackerów UDP. Jeśli torrent ma ustawioną flagę prywatności, aria2 nie użyje DHT dla tego pobrania, nawet jeśli opcja jest ustawiona na true.
    name: Włącz DHT (IPv4)
  enable-dht6:
    description: Włącz funkcję DHT dla IPv6. Jeśli torrent ma ustawioną flagę prywatności, aria2 nie użyje DHT dla tego pobrania, nawet jeśli opcja jest ustawiona na true. Aby określić port nasłuchiwania, użyj opcji --dht-listen-port.
    name: Włącz DHT (IPv6)
  enable-http-keep-alive:
    description: Włącz trwałe połączenie HTTP/1.1.
    name: Włącz trwałe połączenie
  enable-http-pipelining:
    description: Włącz pipelining HTTP/1.1.
    name: Włącz HTTP Pipelining
  enable-mmap:
    description: Mapowanie plików do pamięci. Ta opcja może nie działać, jeśli przestrzeń pliku nie jest wcześniej przydzielona. Zobacz --file-allocation.
    name: Włącz MMap
  enable-peer-exchange:
    description: Włącz rozszerzenie wymiany peerów (PEX). Jeśli torrent ma ustawioną flagę prywatności, ta funkcja jest wyłączona, nawet jeśli true jest ustawione.
    name: Włącz wymianę peerów
  enable-rpc:
    name: Włącz Serwer JSON-RPC/XML-RPC
  event-poll:
    description: Określ metodę sondowania zdarzeń. Możliwe wartości to epoll, kqueue, port, poll i select. Każda z tych metod jest dostępna, jeśli system ją obsługuje. epoll jest dostępny w nowszych wersjach Linuksa. kqueue jest dostępny na różnych systemach *BSD, w tym Mac OS X. port jest dostępny na Open Solaris. Domyślna wartość może się różnić w zależności od używanego systemu.
    name: Metoda sondowania zdarzeń
  file-allocation:
    description: Określ metodę przydzielania plików. none nie przydziela przestrzeni pliku przed pobieraniem. prealloc przydziela przestrzeń pliku przed rozpoczęciem pobierania. Może to zająć trochę czasu w zależności od rozmiaru pliku. Jeśli używasz nowszych systemów plików, takich jak ext4 (z obsługą rozszerzeń), btrfs, xfs lub NTFS (tylko kompilacja MinGW), falloc jest najlepszym wyborem. Przydziela duże (kilka GiB) pliki niemal natychmiast. Nie używaj falloc w starszych systemach plików, takich jak ext3 i FAT32, ponieważ trwa to prawie tyle samo, co prealloc, a aria2 jest całkowicie zablokowane do czasu zakończenia alokacji. falloc może być niedostępny, jeśli system nie posiada funkcji posix_fallocate(3). trunc używa systemowego wywołania ftruncate(2) lub odpowiednika specyficznego dla platformy, aby przyciąć plik do określonej długości. W przypadku pobierania wielu plików torrent, pliki przylegające do określonych plików są również przydzielane, jeśli dzielą te same kawałki.
    name: Metoda przydzielania plików
  follow-metalink:
    description: Jeśli ustawione na true lub mem, po pobraniu pliku o rozszerzeniu .meta4, .metalink lub typie zawartości application/metalink4+xml lub application/metalink+xml, aria2 analizuje go jako plik metalink i pobiera pliki w nim wymienione. Jeśli ustawione na mem, plik metalink nie jest zapisywany na dysku, a jedynie przechowywany w pamięci. Jeśli ustawione na false, plik .metalink jest pobierany na dysk, ale nie jest analizowany jako plik metalink, a jego zawartość nie jest pobierana.
    name: Śledzenie Metalink
  follow-torrent:
    description: Jeśli ustawione na true lub mem, pliki z rozszerzeniem .torrent lub typem MIME application/x-bittorrent są traktowane jako torrenty i ich zawartość jest pobierana. Jeśli ustawione na mem, plik .torrent nie jest zapisywany na dysku, a jedynie przechowywany w pamięci. Jeśli false, plik .torrent jest pobierany, ale nie jest analizowany ani używany do pobierania jego zawartości.
    name: Śledź torrenta
  force-save:
    description: Zapisz pobieranie za pomocą opcji --save-session, nawet jeśli pobieranie zostało zakończone lub usunięte. Opcja ta zapisuje również plik kontrolny w takich sytuacjach. Może to być przydatne do zapisania udostępniania plików w stanie zakończonym.
    name: Wymuś Zapis
  ftp-passwd:
    description: Jeśli nazwa użytkownika jest osadzona w URI, ale hasło nie, aria2 spróbuje znaleźć hasło w pliku .netrc. Jeśli je znajdzie, zostanie użyte, w przeciwnym razie użyte zostanie hasło określone w tej opcji.
    name: Domyślne hasło FTP
  ftp-pasv:
    description: Użyj trybu pasywnego w FTP. Jeśli ustawione na false, używany będzie tryb aktywny. Opcja ta jest ignorowana dla transferów SFTP.
    name: Tryb pasywny
  ftp-proxy-passwd:
    name: Hasło proxy FTP
  ftp-proxy-user:
    name: Nazwa użytkownika proxy FTP
  ftp-proxy:
    name: Serwer proxy FTP
  ftp-reuse-connection:
    name: Ponowne użycie połączenia
  ftp-type:
    description: Ustawia typ transferu FTP, binary albo ascii. Domyślną wartością jest binary. Przy SFTP opcja jest ignorowana.
    name: Typ transferu
  ftp-user:
    name: Domyślna nazwa użytkownika FTP
  hash-check-only:
    description: Jeśli podano "true", po sprawdzeniu haszu przy użyciu opcji --check-integrity, pobieranie zostanie przerwane, niezależnie od tego, czy plik został pobrany w całości.
    name: Tylko Sprawdzenie Hasz
  header:
    description: 'Dodaj nagłówek HEADER do żądania HTTP. Każdy wpis w osobnej linii w formacie "nazwa nagłówka: wartość nagłówka".'
    name: Niestandardowy nagłówek
  http-accept-gzip:
    description: 'Wyślij nagłówek żądania Accept: deflate, gzip i zdekompresuj odpowiedź, jeśli zdalny serwer odpowiada nagłówkiem Content-Encoding: gzip lub Content-Encoding: deflate.'
    name: Akceptuj GZip
  http-auth-challenge:
    description: 'Wyślij nagłówek autoryzacji HTTP tylko wtedy, gdy jest to wymagane przez serwer. Jeśli podano false, nagłówek autoryzacji jest zawsze wysyłany do serwera. Istnieje wyjątek: jeśli nazwa użytkownika i hasło są osadzone w URI, nagłówek autoryzacji jest zawsze wysyłany do serwera, niezależnie od tej opcji.'
    name: Wyzwanie autoryzacji HTTP
  http-no-cache:
    description: 'Wysyłaj nagłówki Cache-Control: no-cache i Pragma: no-cache, aby uniknąć buforowania treści. Jeśli ustawione na false, te nagłówki nie są wysyłane i można dodać nagłówek Cache-Control z dowolną dyrektywą, używając opcji --header.'
    name: Brak cache
  http-passwd:
    name: Domyślne hasło HTTP
  http-proxy-passwd:
    name: Hasło proxy HTTP
  http-proxy-user:
    name: Nazwa użytkownika proxy HTTP
  http-proxy:
    name: Serwer proxy HTTP
  http-user:
    name: Domyślna nazwa użytkownika HTTP
  https-proxy-passwd:
    name: Hasło proxy HTTPS
  https-proxy-user:
    name: Nazwa użytkownika proxy HTTPS
  https-proxy:
    name: Serwer proxy HTTPS
  human-readable:
    description: Wyświetl rozmiary i prędkości w formacie przyjaznym dla człowieka (np. 1.2Ki, 3.4Mi) w konsoli.
    name: Ludzko Czytelny Format Konsoli
  keep-unfinished-download-result:
    description: Zachowaj wyniki niedokończonych pobrań, nawet jeśli ich liczba przekracza --max-download-result. To przydatne, jeśli chcesz, aby wszystkie niedokończone pobrania zostały zapisane w pliku sesji (zobacz opcję --save-session). Pamiętaj, że nie ma górnej granicy liczby niedokończonych wyników do zapisania. Jeśli jest to niepożądane, wyłącz tę opcję.
    name: Zachowaj Wyniki Niedokończonych Pobierania
  listen-port:
    description: 'Ustaw numer portu TCP dla pobrań BitTorrenta. Można określić wiele portów, np. 6881,6885. Można także podać zakres, np. 6881-6999, lub kombinację: 6881-6889,6999.'
    name: Port nasłuchiwania
  log-level:
    name: Poziom Logów
  log:
    description: Nazwa pliku dziennika. Jeśli podano -, dziennik jest zapisywany na standardowe wyjście. Jeśli podano pusty ciąg (""), dziennik nie jest zapisywany na dysku.
    name: Plik dziennika
  lowest-speed-limit:
    description: Zamknij połączenie, jeśli prędkość pobierania jest mniejsza lub równa tej wartości (bajty na sekundę). 0 oznacza, że aria2 nie ma minimalnej prędkości pobierania. Możesz dodać K lub M (1K = 1024, 1M = 1024K). Ta opcja nie wpływa na pobieranie BitTorrent.
    name: Minimalna prędkość pobierania
  max-concurrent-downloads:
    name: Maksymalna liczba równoczesnych pobrań
  max-connection-per-server:
    name: Maksymalna liczba połączeń na serwer
  max-download-limit:
    description: Ustaw maksymalną prędkość pobierania na pojedyncze pobieranie w bajtach na sekundę. 0 oznacza brak ograniczeń. Możesz dodać K lub M (1K = 1024, 1M = 1024K).
    name: Maksymalny Limit Pobierania
  max-download-result:
    description: Ustaw maksymalną liczbę wyników pobierania przechowywanych w pamięci. Wyniki pobierania obejmują pobrane, błędne i usunięte pliki. Wyniki pobierania są przechowywane w kolejce FIFO i może pomieścić maksymalnie NUM wyników pobierania. Gdy kolejka jest pełna, a nowy wynik pobierania zostaje utworzony, najstarszy wynik zostaje usunięty, a nowy dodany na koniec. Ustawienie dużej liczby w tej opcji może spowodować wysokie zużycie pamięci po tysiącach pobrań. Określenie wartości 0 oznacza, że żadne wyniki pobierania nie będą przechowywane. Należy pamiętać, że niedokończone pobrania są przechowywane w pamięci, niezależnie od tej opcji. Zobacz opcję --keep-unfinished-download-result.
    name: Maksymalna Liczba Wyników Pobierania
  max-file-not-found:
    description: Jeśli aria2 otrzyma status "plik nie znaleziony" od zdalnych serwerów HTTP/FTP NUM razy bez pobrania ani jednego bajtu, wymuś niepowodzenie pobierania. Podaj 0, aby wyłączyć tę opcję. Ta opcja jest skuteczna tylko przy użyciu serwerów HTTP/FTP. Liczba prób jest liczona w kierunku --max-tries, więc należy ją również skonfigurować.
    name: Maksymalna liczba prób nieznalezienia pliku
  max-mmap-limit:
    description: Ustaw maksymalny rozmiar pliku, dla którego włączone będzie mmap (zobacz opcję --enable-mmap). Rozmiar pliku jest określany przez sumę wszystkich plików zawartych w jednym pobieraniu. Na przykład, jeśli pobieranie zawiera 5 plików, rozmiar pliku to całkowity rozmiar tych plików. Jeśli rozmiar pliku jest większy niż wartość określona w tej opcji, mmap zostanie wyłączone.
    name: Maksymalny Limit MMap
  max-overall-download-limit:
    description: Ustaw maksymalną prędkość pobierania łączną w bajtach na sekundę. 0 oznacza brak ograniczeń. Możesz dodać K lub M (1K = 1024, 1M = 1024K).
    name: Maksymalny Limit Łącznego Pobierania
  max-overall-upload-limit:
    description: Ustaw maksymalną globalną prędkość wysyłania w bajtach na sekundę. 0 oznacza brak ograniczeń. Możesz dodać K lub M (1K = 1024, 1M = 1024K).
    name: Maksymalny globalny limit wysyłania
  max-resume-failure-tries:
    description: Gdy używasz opcji --always-resume=false, aria2 pobiera plik od nowa, gdy wykryje N liczbę URI, które nie obsługują wznowienia. Jeśli N wynosi 0, aria2 pobierze plik od nowa, gdy wszystkie URI nie obsługują wznowienia. Zobacz opcję --always-resume.
    name: Maksymalna Liczba Prób Wznawiania
  max-tries:
    description: Ustaw liczbę prób. 0 oznacza nieograniczoną liczbę prób.
    name: Maksymalna liczba prób
  max-upload-limit:
    description: Ustaw maksymalną prędkość wysyłania na torrent w bajtach na sekundę. 0 oznacza brak ograniczeń. Możesz dodać K lub M (1K = 1024, 1M = 1024K).
    name: Maksymalny limit wysyłania
  metalink-base-uri:
    description: Określa bazowy URI do rozwiązywania względnych URI w elementach metalink:url i metalink:metaurl w pliku metalink zapisanym na lokalnym dysku. Jeśli URI wskazuje na katalog, musi kończyć się znakiem /.
    name: Bazowy URI
  metalink-enable-unique-protocol:
    description: Jeśli ustawione na true i dla danego mirrora w pliku metalink dostępnych jest kilka protokołów, aria2 używa jednego z nich. Aby określić preferowany protokół, użyj opcji --metalink-preferred-protocol.
    name: Włącz Unikalny Protokół
  metalink-language:
    name: Język
  metalink-location:
    description: Lokalizacja preferowanego serwera. Można podać listę lokalizacji oddzielonych przecinkami, np. jp,us.
    name: Preferowana Lokalizacja Serwera
  metalink-os:
    description: System operacyjny pliku do pobrania.
    name: System Operacyjny
  metalink-preferred-protocol:
    description: Określa preferowany protokół. Możliwe wartości to http, https, ftp i none. Ustawienie none wyłącza tę funkcję.
    name: Preferowany Protokół
  metalink-version:
    description: Wersja pliku do pobrania.
    name: Wersja
  min-split-size:
    description: 'aria2 nie dzieli zakresu mniejszego niż 2*SIZE bajtów. Na przykład rozważmy pobieranie pliku 20MiB. Jeśli SIZE to 10M, aria2 może podzielić plik na 2 zakresy [0-10MiB) i [10MiB-20MiB) i pobrać go za pomocą 2 źródeł (jeśli --split >= 2, oczywiście). Jeśli SIZE to 15M, ponieważ 2*15M > 20MiB, aria2 nie dzieli pliku i pobiera go za pomocą 1 źródła. Możesz dodać K lub M (1K = 1024, 1M = 1024K). Możliwe wartości: 1M-1024M.'
    name: Minimalny rozmiar podziału
  min-tls-version:
    description: Określa minimalną wersję SSL/TLS do włączenia.
    name: Minimalna Wersja TLS
  netrc-path:
    name: Ścieżka .netrc
  no-conf:
    name: Wyłącz Plik Konfiguracyjny
  no-file-allocation-limit:
    description: Brak alokacji pliku dla plików mniejszych niż SIZE. Możesz dodać K lub M (1K = 1024, 1M = 1024K).
    name: Brak Limitów Alokacji Pliku
  no-netrc:
    name: Wyłącz netrc
  no-proxy:
    description: Określ listę nazw hostów, domen i adresów sieciowych z maską podsieci lub bez, gdzie nie powinno się używać proxy.
    name: Lista bez proxy
  no-want-digest-header:
    description: Przy true aria2 nie wysyła nagłówka Want-Digest w żądaniach. Domyślną wartością jest false.
    name: Nie wysyłaj nagłówka Want-Digest
  optimize-concurrent-downloads:
    description: Optymalizuje liczbę równoczesnych pobrań zgodnie z dostępną przepustowością. aria2 wykorzystuje prędkość pobierania z poprzednich pobrań, aby dostosować liczbę pobrań uruchamianych równolegle zgodnie z zasadą N = A + B Log10(prędkość w Mbps). Współczynniki A i B można dostosować, oddzielając je dwukropkiem. Domyślne wartości (A=5, B=25) prowadzą do używania typowo 5 równoczesnych pobrań w sieci 1Mbps i ponad 50 w sieci 100Mbps. Liczba równoczesnych pobrań pozostaje ograniczona maksymalną wartością określoną przez opcję --max-concurrent-downloads.
    name: Optymalizuj Równoczesne Pobierania
  out:
    description: Nazwa pobieranego pliku. Jest zawsze względna do katalogu podanego w opcji --dir. Gdy używana jest opcja --force-sequential, ta opcja jest ignorowana.
    name: Nazwa pliku
  parameterized-uri:
    description: 'Włącz obsługę parametryzowanych URI. Możesz określić zestaw części: http://{sv1,sv2,sv3}/foo.iso. Możesz także określić numeryczne ciągi z licznikiem kroków: http://host/image[000-100:2].img. Licznik kroków może zostać pominięty. Jeśli wszystkie URI nie wskazują na ten sam plik, jak w drugim przykładzie, wymagane jest użycie opcji -Z.'
    name: Włącz Użycie Parametryzowanych URI
  pause-metadata:
    description: 'Wstrzymuje pobrania utworzone w wyniku pobierania metadanych. Istnieją 3 typy pobierania metadanych w aria2: (1) pobieranie pliku .torrent, (2) pobieranie metadanych torrenta za pomocą linku magnetycznego, (3) pobieranie pliku metalink. Pobrania utworzone na podstawie tych metadanych zostaną wstrzymane. Opcja działa tylko wtedy, gdy ustawiono --enable-rpc=true.'
    name: Wstrzymaj Po Pobieraniu Metadanych
  peer-agent:
    description: Określa ciąg używany podczas rozszerzonego handshake BitTorrenta dla wersji klienta peera.
    name: Agent Peera
  peer-id-prefix:
    description: Określ prefiks ID peera. Pełne ID ma długość 20 bajtów. Jeśli podasz więcej, zostanie przycięte. Jeśli mniej, zostaną dodane losowe bajty.
    name: Prefiks ID peera
  piece-length:
    description: Określ długość części dla pobrań HTTP/FTP. Jest to granica, przy której aria2 dzieli plik. Wszystkie podziały odbywają się w wielokrotnościach tej długości. Ta opcja zostanie zignorowana w pobieraniach BitTorrent. Zostanie również zignorowana, jeśli plik Metalink zawiera sumy kontrolne dla części.
    name: Długość Części
  proxy-method:
    description: Ustaw metodę używaną w żądaniu proxy. METHOD to albo GET, albo TUNNEL. Pobieranie HTTPS zawsze używa TUNNEL, niezależnie od tej opcji.
    name: Metoda proxy
  quiet:
    name: Wyłącz Wyjście w Konsoli
  realtime-chunk-checksum:
    description: Sprawdzenie części danych przez obliczenie sumy kontrolnej podczas pobierania pliku, jeśli dostępne są sumy kontrolne dla części.
    name: Walidacja Części Danych w Czasie Rzeczywistym
  referer:
    description: Ustawia odsyłający adres HTTP (Referer). Dotyczy wszystkich pobrań HTTP/HTTPS. Jeśli podano *, adres URI pobierania jest również używany jako referer. Może to być przydatne w połączeniu z opcją --parameterized-uri.
    name: Referer
  remote-time:
    description: Pobierz znacznik czasu zdalnego pliku z zdalnego serwera HTTP/FTP i, jeśli jest dostępny, zastosuj go do lokalnego pliku.
    name: Zdalny znacznik czasu pliku
  remove-control-file:
    description: Usuń plik kontrolny przed pobraniem. Używając z --allow-overwrite=true, pobieranie zawsze rozpocznie się od nowa. Będzie to przydatne dla użytkowników korzystających z serwerów proxy, które uniemożliwiają wznowienie pobierania.
    name: Usuń Plik Kontrolny
  retry-wait:
    description: Ustaw liczbę sekund do oczekiwania między próbami. Gdy SEC > 0, aria2 ponowi pobieranie, gdy serwer HTTP zwróci odpowiedź 503.
    name: Czas oczekiwania między próbami
  reuse-uri:
    description: Ponownie użyj już użytych URI, jeśli nie ma dostępnych nieużywanych URI.
    name: Ponowne użycie URI
  rlimit-nofile:
    description: 'Ustaw miękki limit otwartych deskryptorów plików. Ta opcja będzie miała wpływ tylko wtedy, gdy: a. System ją obsługuje (posix). b. Limit nie przekracza twardego limitu. c. Określony limit jest większy niż aktualny miękki limit. Jest to równoważne ustawieniu nofile za pomocą ulimit, z tym, że nigdy nie zmniejsza limitu. Ta opcja jest dostępna tylko na systemach wspierających API rlimit.'
    name: Miękki limit otwartych deskryptorów plików
  rpc-allow-origin-all:
    description: Dodaje nagłówek Access-Control-Allow-Origin z wartością * do odpowiedzi RPC.
    name: Zezwól na Żądania ze Wszystkich Źródeł
  rpc-listen-all:
    description: Nasłuchuje przychodzących żądań JSON-RPC/XML-RPC na wszystkich interfejsach sieciowych. Jeśli ustawione na false, nasłuchuje tylko na lokalnym interfejsie pętli zwrotnej.
    name: Nasłuchuj na Wszystkich Interfejsach Sieciowych
  rpc-listen-port:
    name: Port Nasłuchu
  rpc-max-request-size:
    description: Ustawia maksymalny rozmiar żądania JSON-RPC/XML-RPC. Jeśli aria2 wykryje, że żądanie przekracza SIZE bajtów, połączenie zostanie odrzucone.
    name: Maksymalny Rozmiar Żądania
  rpc-save-upload-metadata:
    description: Zapisuje przesłane metadane torrenta lub metalink w katalogu określonym przez opcję --dir. Nazwa pliku składa się z szesnastkowego skrótu SHA-1 metadanych plus rozszerzenie. Dla torrenta rozszerzenie to '.torrent', a dla metalink '.meta4'. Jeśli ustawione na false, pobrania dodane przez aria2.addTorrent() lub aria2.addMetalink() nie zostaną zapisane przez opcję --save-session.
    name: Zapisz Metadane Przesyłania
  rpc-secure:
    description: Transport RPC będzie szyfrowany za pomocą SSL/TLS. Klienci RPC muszą używać schematu https do dostępu do serwera. W przypadku klienta WebSocket użyj schematu wss. Aby określić certyfikat serwera i klucz prywatny, użyj opcji --rpc-certificate i --rpc-private-key.
    name: Włącz SSL/TLS
  save-cookies:
    description: Zapisz pliki cookies do pliku FILE w formacie Mozilla/Firefox(1.x/2.x)/Netscape. Jeśli FILE już istnieje, zostanie nadpisany. Sesyjne cookies również są zapisywane, a ich wartości wygaśnięcia są traktowane jako 0.
    name: Ścieżka do pliku cookies
  save-not-found:
    description: Zapisz pobieranie za pomocą opcji --save-session, nawet jeśli plik nie został znaleziony na serwerze. Opcja ta zapisuje również plik kontrolny w takich sytuacjach.
    name: Zapisz Plik, Który Nie Został Znaleziony
  save-session-interval:
    description: Zapisz błędy/niedokończone pobrania do pliku określonego przez --save-session co SEC sekund. Ustawienie 0 oznacza, że plik będzie zapisywany tylko przy zakończeniu działania aria2.
    name: Interwał Zapisów Sesji
  save-session:
    description: Zapisz błędy/niedokończone pobrania do PLIKU po zakończeniu. Możesz przekazać ten plik do aria2c za pomocą opcji --input-file podczas ponownego uruchomienia. Jeśli chcesz, aby plik wynikowy był zapisany w formacie gzip, dodaj rozszerzenie .gz do nazwy pliku. Należy pamiętać, że pobrania dodane za pomocą metody RPC aria2.addTorrent() i aria2.addMetalink(), których metadane nie mogą zostać zapisane jako plik, nie będą zapisane. Pobrania usunięte za pomocą aria2.remove() i aria2.forceRemove() nie będą zapisane.
    name: Plik Zapisanej Sesji
  seed-ratio:
    description: Określa współczynnik udostępniania. Seedy zakończone torrenty do momentu, gdy współczynnik udostępniania osiągnie RATIO. Zaleca się ustawienie wartości równej lub większej niż 1.0. Ustawienie 0.0 powoduje seedowanie bez względu na współczynnik udostępniania. Jeśli opcja --seed-time jest również określona, seedowanie kończy się, gdy spełniony zostanie przynajmniej jeden z warunków.
    name: Minimalny Współczynnik Udostępniania
  seed-time:
    description: Określa czas seedowania w (częściowych) minutach. Ustawienie --seed-time=0 wyłącza seedowanie po zakończeniu pobierania.
    name: Minimalny Czas Seedowania
  server-stat-of:
    description: Określ nazwę pliku, do którego zapisywany jest profil wydajności serwerów. Możesz załadować zapisane dane za pomocą opcji --server-stat-if.
    name: Plik statystyk serwera
  server-stat-timeout:
    description: Określa limit czasu w sekundach na unieważnienie profilu wydajności serwerów od ostatniego kontaktu z nimi.
    name: Limit czasu statystyk serwera
  show-console-readout:
    name: Wyświetl Wyniki w Konsoli
  socket-recv-buffer-size:
    description: Ustaw maksymalny rozmiar bufora odbioru gniazda w bajtach. Określenie 0 wyłącza tę opcję. Wartość ta będzie ustawiona dla deskryptora gniazda za pomocą opcji SO_RCVBUF.
    name: Rozmiar Bufora Odbioru Gniazda
  split:
    description: Pobierz plik za pomocą N połączeń. Jeśli podano więcej niż N URI, pierwsze N URI jest używane, a pozostałe URI są używane jako zapasowe. Jeśli podano mniej niż N URI, te URI są używane więcej niż raz, tak aby łącznie było N jednoczesnych połączeń. Liczba połączeń do tego samego hosta jest ograniczona przez opcję --max-connection-per-server.
    name: Liczba podziałów
  ssh-host-key-md:
    description: 'Ustaw sumę kontrolną klucza publicznego hosta SSH. Format wartości to TYPE=DIGEST. TYPE to typ hasha (obsługiwane: sha-1 lub md5). DIGEST to suma kontrolna w formacie szesnastkowym. Przykład: sha-1=b030503d4de4539dc7885e6f0f5e256704edf4c3. Opcja ta może być używana do weryfikacji klucza publicznego serwera podczas korzystania z SFTP. Jeśli nie ustawiono tej opcji (domyślnie), weryfikacja nie jest wykonywana.'
    name: Suma kontrolna klucza publicznego SSH
  stop:
    description: Zakończ działanie programu po upływie SEC sekund. Jeśli 0, ta funkcja jest wyłączona.
    name: Automatyczne Zakończenie
  stream-piece-selector:
    description: Określ algorytm wyboru fragmentów używany w pobieraniu HTTP/FTP. Fragment oznacza segment o stałej długości, który jest pobierany równolegle w pobieraniu segmentowym. Jeśli podano default, aria2 wybiera fragment tak, aby zmniejszyć liczbę nawiązywanych połączeń. Jest to rozsądne domyślne zachowanie, ponieważ nawiązanie połączenia jest kosztowną operacją. Jeśli podano inorder, aria2 wybiera fragment o najniższym indeksie. Indeks=0 oznacza pierwszy fragment pliku. Będzie to przydatne do oglądania filmu podczas jego pobierania. Opcja --enable-http-pipelining może być przydatna do zmniejszenia narzutu ponownego łączenia. Należy pamiętać, że aria2 honoruje opcję --min-split-size, więc konieczne będzie określenie rozsądnej wartości dla opcji --min-split-size. Jeśli podano random, aria2 wybiera fragment losowo. Podobnie jak w przypadku inorder, opcja --min-split-size jest honorowana. Jeśli podano geom, na początku aria2 wybiera fragment o najniższym indeksie, jak w przypadku inorder, ale wykładniczo zwiększa odstęp od poprzednio wybranego fragmentu. Zmniejszy to liczbę nawiązywanych połączeń i jednocześnie pobierze początkową część pliku jako pierwszą. Będzie to przydatne do oglądania filmu podczas jego pobierania.
    name: Algorytm wyboru fragmentów
  summary-interval:
    description: Określ interwał w sekundach dla wyświetlania podsumowania postępu pobierania. Ustawienie 0 tłumi wyjście.
    name: Interwał Podsumowania Pobierania
  timeout:
    name: Limit czasu
  truncate-console-readout:
    description: Przytnij wyjście konsoli do jednej linii.
    name: Ostrzeżenia Konsoli
  uri-selector:
    description: Określ algorytm wyboru URI. Możliwe wartości to inorder, feedback i adaptive. Jeśli podano inorder, URI są próbowane w kolejności pojawienia się na liście URI. Jeśli podano feedback, aria2 używa prędkości pobierania obserwowanej w poprzednich pobraniach i wybiera najszybszy serwer na liście URI. To również skutecznie pomija martwe lustra. Obserwowana prędkość pobierania jest częścią profilu wydajności serwerów wymienionych w --server-stat-of i --server-stat-if. Jeśli podano adaptive, wybiera jedno z najlepszych luster dla pierwszego i zarezerwowanego połączenia. Dla uzupełniających, zwraca lustra, które nie zostały jeszcze przetestowane, a jeśli każde z nich zostało już przetestowane, zwraca lustra, które muszą zostać ponownie przetestowane. W przeciwnym razie nie wybiera więcej luster. Podobnie jak feedback, używa profilu wydajności serwerów.
    name: Algorytm wyboru URI
  use-head:
    description: Użyj metody HEAD dla pierwszego żądania do serwera HTTP.
    name: Użyj metody HEAD
  user-agent:
    name: Niestandardowy User Agent
